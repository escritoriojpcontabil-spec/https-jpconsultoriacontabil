  // Consults BrasilAPI, a free public service that mirrors Receita Federal's official
  // CNPJ registry (Cadastro Nacional da Pessoa Jurídica), to auto-fill company data.
  const IS_FILE_PROTOCOL = window.location.protocol === 'file:';

  async function lookupCnpj(cnpjRaw){
    const cnpj = onlyDigits(cnpjRaw);
    if(cnpj.length !== 14){
      return { ok:false, error:'Digite um CNPJ completo com 14 dígitos.' };
    }
    if(IS_FILE_PROTOCOL){
      return { ok:false, error:'A busca automática não funciona quando o arquivo é aberto direto do computador (endereço começando com "file://"). Os navegadores bloqueiam esse tipo de página de acessar sites externos, por segurança — isso vale para qualquer sistema, não só este. Para usar a busca, abra o sistema pela conversa do Claude. Por enquanto, preencha os dados manualmente abaixo.' };
    }
    try{
      const resp = await fetch('https://brasilapi.com.br/api/cnpj/v1/' + cnpj);
      if(resp.status === 404){
        return { ok:false, error:'CNPJ não encontrado na base da Receita Federal.' };
      }
      if(!resp.ok){
        return { ok:false, error:'Não foi possível consultar a Receita Federal agora (' + resp.status + ').' };
      }
      const data = await resp.json();
      return { ok:true, data };
    }catch(e){
      return { ok:false, error:'Falha de conexão ao consultar a Receita Federal. Verifique sua internet.' };
    }
  }

    state.transactions.sort((a,b)=> (b.date||'').localeCompare(a.date||''));

    // Migration: transactions still tagged with the old combined department value
    // "Fiscal Contábil" (before it was split into "Fiscal" and "Contábil") are reassigned to "Fiscal".
    // Clients used to carry a single "department" field; now a client can belong to several
    // departments at once, so any leftover single value is converted into the new array.
    for(const c of state.clients){
      if(c.department !== undefined){
        const legacy = c.department === 'Fiscal Contábil' ? 'Fiscal' : c.department;
        if(!Array.isArray(c.departments)) c.departments = [];
        if(legacy && !c.departments.includes(legacy)) c.departments.push(legacy);
        delete c.department;
        try{ await Store.set('clients:'+c.id, JSON.stringify(c), true); }catch(e){}
      }
    }
    for(const t of state.transactions){
      if(t.department === 'Fiscal Contábil'){
        t.department = 'Fiscal';
        try{ await Store.set('transactions:'+t.id, JSON.stringify(t), true); }catch(e){}
      }
    }
  }

  let _loadPlanoContasPromise = null;

    _loadPlanoContasPromise = _loadPlanoContasInner().finally(()=>{ _loadPlanoContasPromise = null; });

  // Remove contas duplicadas (mesmo código + mesma empresa) que ficaram de uma corrida
  // anterior nas migrações automáticas — mantém a primeira, apaga as demais, e reaponta
  // qualquer lançamento contábil que estivesse usando o "id" das duplicatas removidas.
  async function dedupPlanoContas(){
    const vistos = new Map();
    const duplicadas = [];
    for(const c of state.planoContas){
      const chave = (c.clientId||'') + '|' + c.codigo;
      if(vistos.has(chave)) duplicadas.push({dup: c, keepId: vistos.get(chave)});
      else vistos.set(chave, c.id);
    }
    if(!duplicadas.length) return;
    let lancRepontados = false;
    for(const {dup, keepId} of duplicadas){
      for(const l of state.lancamentosContabeis){
        let mudou = false;
        if(l.contaDebito === dup.id){ l.contaDebito = keepId; mudou = true; }
        if(l.contaCredito === dup.id){ l.contaCredito = keepId; mudou = true; }
        if(mudou){ await Store.set('lancamentoscontabeis:'+l.id, JSON.stringify(l), true); lancRepontados = true; }
      }
      await Store.delete('planocontas:'+dup.id, true);
    }
    state.planoContas = state.planoContas.filter(c=>!duplicadas.some(d=>d.dup.id===c.id));
    if(lancRepontados) await loadLancamentosContabeis();
  }

  // Mesmo cuidado para o Histórico Contábil (não precisa reapontar nada, o histórico do
  // lançamento é gravado como texto, não como referência a um "id").
  async function dedupHistoricos(){
    const vistos = new Map();
    const duplicados = [];
    for(const h of state.historicos){
      const chave = (h.clientId||'') + '|' + h.codigo;
      if(vistos.has(chave)) duplicados.push(h);
      else vistos.set(chave, h.id);
    }
    if(!duplicados.length) return;
    for(const h of duplicados){ await Store.delete('historicos:'+h.id, true); }
    state.historicos = state.historicos.filter(h=>!duplicados.some(d=>d.id===h.id));
  }

  // ============================================================================
  // MOTOR DE CÁLCULO CONTÁBIL — Balancete, Balanço Patrimonial e DRE, a partir dos
  // Lançamentos Contábeis já registrados. Estrutura conforme Lei 6.404/76 (arts. 178 a 187),
  // aplicável subsidiariamente às demais sociedades por força do Art. 1.179 do Código Civil.
  // ============================================================================

  // Soma débitos/créditos lançados para uma conta específica, dentro de um intervalo de datas.
  // dataInicio/dataFim são opcionais (strings YYYY-MM-DD); omitir = sem limite naquele lado.
  function movimentoConta(contaId, clientId, dataInicio, dataFim){
    let debitos = 0, creditos = 0;
    state.lancamentosContabeis.forEach(l=>{
      if(l.clientId !== clientId) return;
      if(dataInicio && l.data < dataInicio) return;
      if(dataFim && l.data > dataFim) return;
      if(l.contaDebito === contaId) debitos += Number(l.valor)||0;
      if(l.contaCredito === contaId) creditos += Number(l.valor)||0;
    });
    return { debitos, creditos };
  }

  // Saldo de uma conta (analítica: direto; sintética: soma recursiva das analíticas-filhas)
  // dentro do período informado, considerando a natureza (Devedora/Credora) para o sinal.
  function saldoConta(conta, clientId, dataInicio, dataFim){
    if(conta.tipo === 'Analítica'){
      const {debitos, creditos} = movimentoConta(conta.id, clientId, dataInicio, dataFim);
      return conta.natureza==='Devedora' ? (debitos-creditos) : (creditos-debitos);
    }
    const prefix = conta.codigo + '.';
    const filhas = state.planoContas.filter(c=>c.clientId===clientId && c.tipo==='Analítica' && c.codigo.startsWith(prefix));
    let total = 0;
    filhas.forEach(f=>{
      const {debitos, creditos} = movimentoConta(f.id, clientId, dataInicio, dataFim);
      total += f.natureza==='Devedora' ? (debitos-creditos) : (creditos-debitos);
    });
    return total;
  }

  // Resultado do exercício (Receitas - Custos - Despesas) num período — usado tanto na DRE
  // quanto para compor o Patrimônio Líquido do Balanço (resultado ainda não "fechado").
  function calcResultadoExercicio(clientId, dataInicio, dataFim){
    const contasDe = (prefixo)=> state.planoContas.filter(c=>c.clientId===clientId && c.tipo==='Analítica' && c.codigo.startsWith(prefixo));
    function somaGrupo(prefixo){
      return contasDe(prefixo).reduce((soma, c)=>{
        const {debitos, creditos} = movimentoConta(c.id, clientId, dataInicio, dataFim);
        const saldo = c.natureza==='Credora' ? (creditos-debitos) : (debitos-creditos);
        return soma + saldo;
      }, 0);
    }
    const receitaBruta = somaGrupo('4.1');
    const deducoes = somaGrupo('4.2');
    const receitaLiquida = receitaBruta - deducoes;
    const custos = somaGrupo('5');
    const lucroBruto = receitaLiquida - custos;
    const despesasAdm = somaGrupo('6.1');
    const despesasCom = somaGrupo('6.2');
    const despesasFin = somaGrupo('6.3');
    const despesasTrib = somaGrupo('6.4');
    const despesasPessoal = somaGrupo('6.5');
    const totalDespesas = despesasAdm + despesasCom + despesasFin + despesasTrib + despesasPessoal;
    const resultado = lucroBruto - totalDespesas;
    return { receitaBruta, deducoes, receitaLiquida, custos, lucroBruto, despesasAdm, despesasCom, despesasFin, despesasTrib, despesasPessoal, totalDespesas, resultado };
  }

  // Monta o Balancete de Verificação: para cada conta (sintética e analítica) da empresa,
  // saldo anterior ao período + movimento do período + saldo atual.
  function montarBalancete(clientId, dataInicio, dataFim){
    const contas = state.planoContas.filter(c=>c.clientId===clientId).sort((a,b)=>(a.codigo||'').localeCompare(b.codigo||'', undefined, {numeric:true}));
    return contas.map(c=>{
      const saldoAnterior = dataInicio ? saldoConta(c, clientId, null, dataAnterior(dataInicio)) : 0;
      const saldoAtual = saldoConta(c, clientId, null, dataFim);
      const mov = c.tipo==='Analítica' ? movimentoConta(c.id, clientId, dataInicio, dataFim) : (()=>{
        const prefix = c.codigo + '.';
        const filhas = state.planoContas.filter(x=>x.clientId===clientId && x.tipo==='Analítica' && x.codigo.startsWith(prefix));
        return filhas.reduce((s,f)=>{ const m = movimentoConta(f.id, clientId, dataInicio, dataFim); return {debitos: s.debitos+m.debitos, creditos: s.creditos+m.creditos}; }, {debitos:0, creditos:0});
      })();
      return { conta: c, saldoAnterior, debitosPeriodo: mov.debitos, creditosPeriodo: mov.creditos, saldoAtual };
    });
  }
  function dataAnterior(dataStr){
    const d = new Date(dataStr + 'T00:00:00');
    d.setDate(d.getDate()-1);
    return d.toISOString().slice(0,10);
  }

  // Monta o Balanço Patrimonial (Ativo / Passivo / Patrimônio Líquido) em uma data de referência.
  function montarBalanco(clientId, dataRef){
    const grupos = ['1.1','1.2','2.1','2.2','3.1','3.2','3.3'];
    const linhas = {};
    grupos.forEach(codigo=>{
      const conta = state.planoContas.find(c=>c.clientId===clientId && c.codigo===codigo);
      if(!conta) return;
      linhas[codigo] = { nome: conta.nome, saldo: saldoConta(conta, clientId, null, dataRef) };
    });
    const totalAtivo = (linhas['1.1']?.saldo||0) + (linhas['1.2']?.saldo||0);
    const totalPassivoCirc = (linhas['2.1']?.saldo||0) + (linhas['2.2']?.saldo||0);
    const resultado = calcResultadoExercicio(clientId, null, dataRef).resultado;
    const totalPL = (linhas['3.1']?.saldo||0) + (linhas['3.2']?.saldo||0) + (linhas['3.3']?.saldo||0) + resultado;
    return { linhas, totalAtivo, totalPassivo: totalPassivoCirc, resultadoPeriodo: resultado, totalPL, totalPassivoMaisPL: totalPassivoCirc + totalPL };
  }

  // Integração automática: gera lançamentos contábeis (partidas simples) a partir de eventos
  // do Departamento Pessoal (folha, férias, rescisão) e do Departamento Fiscal (impostos/guias).
  // Cada evento pode gerar mais de um lançamento (ex.: líquido + INSS + IRRF), sempre debitando
  // a conta de despesa correspondente e creditando a obrigação (a pagar) — a baixa efetiva do
  // pagamento (contra Bancos/Caixa) continua sendo um lançamento manual ou vindo da importação OFX.
  function contaIdByCodigo(codigo, clientId){
    const c = state.planoContas.find(x=>x.codigo===codigo && x.clientId===clientId);
    return c ? c.id : null;
  }
  function historicoCatalogoTexto(historicoCodigo, complemento, clientId){
    const h = state.historicos.find(x=>x.codigo===historicoCodigo && x.clientId===clientId);
    const base = h ? (h.codigo + ' — ' + h.descricao) : complemento;
    return h ? base + ' · ' + complemento : base;
  }
  async function gerarLancamentosAutomaticos(clientId, partidas, historicoCodigo, historicoBase){
    if(!clientId) return { ok:false, motivo:'sem-cliente' };
    if(!state.planoContas.some(c=>c.clientId===clientId)){
      return { ok:false, motivo:'sem-plano-de-contas', faltando: [] };
    }
    const faltando = [];
    const entradas = [];
    for(const p of partidas){
      if(!p.valor || p.valor <= 0) continue;
      const dId = contaIdByCodigo(p.contaDebito, clientId);
      const cId = contaIdByCodigo(p.contaCredito, clientId);
      if(!dId || !cId){ faltando.push(p.contaDebito+'/'+p.contaCredito); continue; }
      entradas.push({
        clientId, data: todayStr(), valor: p.valor,
        contaDebito: dId, contaCredito: cId,
        historico: historicoCatalogoTexto(historicoCodigo, historicoBase + ' — ' + p.rotulo, clientId) + ' (lançamento automático)',
        origemAutomatica: true,
      });
    }
    for(const l of entradas){ await saveLancamentoContabilSilent(l); }
    if(entradas.length){ await loadLancamentosContabeis(); render(); }
    return { ok: entradas.length>0, geradas: entradas.length, faltando };
  }

  // Identifica se uma nota fiscal (mesmo cliente + mesmo número + mesma série) já existe,
  // pra não deixar a mesma nota ser importada/cadastrada duas vezes.
  function notaFiscalJaExiste(clientId, numero, serie){
    return state.notasFiscais.some(n=>
      n.clientId === clientId &&
      String(n.numero||'').trim() === String(numero||'').trim() &&
      String(n.serie||'').trim() === String(serie||'').trim()
    );
  }

  // "Impressão digital" (hash SHA-256) do conteúdo exato do arquivo XML — identifica o mesmo
  // arquivo mesmo se, por algum motivo, o número/série não tiverem sido lidos corretamente.
  async function hashArquivoTexto(texto){
    try{
      const dados = new TextEncoder().encode(texto);
      const buffer = await crypto.subtle.digest('SHA-256', dados);
      return Array.from(new Uint8Array(buffer)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }catch(e){ return null; }
  }
  function notaFiscalArquivoJaExiste(xmlHash){
    if(!xmlHash) return false;
    return state.notasFiscais.some(n=> n.xmlHash === xmlHash);
  }

  // Remove notas fiscais duplicadas (mesmo cliente + número + série) que já tenham ficado
  // registradas de importações repetidas antes desta trava existir — mantém a mais antiga.
  async function dedupNotasFiscais(){
    const vistos = new Map();
    const duplicadas = [];
    const ordenadasPorCriacao = state.notasFiscais.slice().sort((a,b)=> (a.id||'').localeCompare(b.id||''));
    for(const n of ordenadasPorCriacao){
      const chave = (n.clientId||'') + '|' + String(n.numero||'').trim() + '|' + String(n.serie||'').trim();
      if(vistos.has(chave)) duplicadas.push(n);
      else vistos.set(chave, n.id);
    }
    // Segunda passada: mesmo hash de arquivo (pega duplicatas que passaram pela primeira
    // checagem por terem número/série levemente diferentes, mas são o mesmo arquivo XML).
    const restantes = state.notasFiscais.filter(n=>!duplicadas.some(d=>d.id===n.id)).sort((a,b)=>(a.id||'').localeCompare(b.id||''));
    const vistosHash = new Map();
    for(const n of restantes){
      if(!n.xmlHash) continue;
      if(vistosHash.has(n.xmlHash)) duplicadas.push(n);
      else vistosHash.set(n.xmlHash, n.id);
    }
    if(!duplicadas.length) return;
    for(const n of duplicadas){ await Store.delete('notasfiscais:'+n.id, true); }
    state.notasFiscais = state.notasFiscais.filter(n=>!duplicadas.some(d=>d.id===n.id));
  }

  async function importAllData(file){
    const msgEl = document.getElementById('importDataMsg');
    function showMsg(text, type){
      if(!msgEl) return;
      msgEl.textContent = text;
      msgEl.className = 'lookup-msg ' + type;
      msgEl.style.display = 'block';
    }
    let data;
    try{
      const text = await file.text();
      data = JSON.parse(text);
    }catch(e){
      showMsg('Arquivo inválido. Selecione um arquivo .json exportado por este sistema.', 'error');
      return;
    }
    if(!data || typeof data !== 'object'){
      showMsg('Arquivo inválido: estrutura não reconhecida.', 'error');
      return;
    }
    const collections = [
      {key:'users', prefix:'users:', idField:'email'},
      {key:'clients', prefix:'clients:', idField:'id'},
      {key:'transactions', prefix:'transactions:', idField:'id'},
      {key:'obrigacoes', prefix:'obrigacoes:', idField:'id'},
      {key:'avisos', prefix:'avisos:', idField:'id'},
      {key:'mensagens', prefix:'mensagens:', idField:'id'},
      {key:'envios', prefix:'envios:', idField:'id'},
      {key:'notasFiscais', prefix:'notasfiscais:', idField:'id'},
      {key:'parcelamentos', prefix:'parcelamentos:', idField:'id'},
      {key:'relatoriosFiscais', prefix:'relatoriosfiscais:', idField:'id'},
      {key:'planoContas', prefix:'planocontas:', idField:'id'},
      {key:'historicos', prefix:'historicos:', idField:'id'},
      {key:'lancamentosContabeis', prefix:'lancamentoscontabeis:', idField:'id'},
      {key:'planoContasReferencial', prefix:'planocontasref:', idField:'id'},
      {key:'propostas', prefix:'propostas:', idField:'id'},
      {key:'funcionarios', prefix:'funcionarios:', idField:'id'},
      {key:'folhas', prefix:'folhas:', idField:'id'},
      {key:'ferias', prefix:'ferias:', idField:'id'},
      {key:'rescisoes', prefix:'rescisoes:', idField:'id'},
    ];
    let totalImported = 0;
    try{
      for(const col of collections){
        const items = Array.isArray(data[col.key]) ? data[col.key] : [];
        for(const item of items){
          const idVal = item[col.idField];
          if(!idVal) continue;
          await Store.set(col.prefix + idVal, JSON.stringify(item), true);
          totalImported++;
        }
      }
    }catch(e){
      showMsg('Falha ao importar: ' + (e && e.message ? e.message : 'erro desconhecido'), 'error');
      return;
    }
    showMsg('Importação concluída: ' + totalImported + ' registro(s) gravado(s) neste ambiente.', 'success');
    await loadAll();
    await loadCentroControleData();
    await loadUsers();
    render();
  }

  async function handleLogin(email, password){
    state.authError = '';
    email = email.trim().toLowerCase();
    if(!email || !password){ state.authError = 'Preencha email e senha.'; render(); return; }
    try{
      const rec = await Store.get('users:'+email, true);
      if(!rec){ state.authError = 'Usuário não encontrado. Cadastre-se abaixo.'; render(); return; }
      const u = JSON.parse(rec.value);
      const hash = await sha256(password);
      if(u.passwordHash !== hash){ state.authError = 'Senha incorreta.'; render(); return; }
      state.user = u;
      await SessionStore.set('session:email', email);
      await loadAll();
      await loadCentroControleData();
      if(state.user.role==='admin') await loadUsers();
      state.view = 'dashboard';
      render();
    }catch(e){ console.error('Erro no login:', e); state.authError = 'Não foi possível entrar agora (' + (e && e.message ? e.message : 'erro desconhecido') + ').'; render(); }
  }

  async function handleRegister(name, email, password, password2){
    state.authError = '';
    email = email.trim().toLowerCase();
    if(!name || !email || !password){ state.authError='Preencha todos os campos.'; render(); return; }
    if(password.length < 4){ state.authError='A senha deve ter ao menos 4 caracteres.'; render(); return; }
    if(password !== password2){ state.authError='As senhas não coincidem.'; render(); return; }
    try{
      const existing = await Store.get('users:'+email, true).catch(()=>null);
      if(existing){ state.authError='Já existe uma conta com este email.'; render(); return; }
      let isFirst = false;
      try{
        const uKeys = await Store.list('users:', true);
        isFirst = !uKeys || !uKeys.keys || uKeys.keys.length===0;
      }catch(e){ isFirst = true; }
      const hash = await sha256(password);
      const user = { email, name, passwordHash: hash, role: isFirst ? 'admin' : 'user', departments: isFirst ? DEPARTMENTS.slice() : [], createdAt: new Date().toISOString() };
      await Store.set('users:'+email, JSON.stringify(user), true);
      state.user = user;
      await SessionStore.set('session:email', email);
      await loadAll();
      await loadCentroControleData();
      if(state.user.role==='admin') await loadUsers();
      state.view='dashboard';
      render();
    }catch(e){ console.error('Erro no cadastro:', e); state.authError='Não foi possível cadastrar agora (' + (e && e.message ? e.message : 'erro desconhecido') + ').'; render(); }
  }

  function monthKey(d){ return d ? d.slice(0,7) : ''; }
  function last6Months(){
    const arr=[]; const now=new Date();
    for(let i=5;i>=0;i--){
      const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
      arr.push(d.toISOString().slice(0,7));
    }
    return arr;
  }
  function monthLabel(mk){
    const [y,m]=mk.split('-');
    const names=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
    return names[parseInt(m,10)-1];

  function computeTotals(){
    const now = new Date();
    const curMonth = now.toISOString().slice(0,7);
    let receitasMes=0, despesasMes=0, saldoTotal=0;
    state.transactions.forEach(t=>{
      const v = Number(t.value)||0;
      if(t.type==='receita') saldoTotal += v; else saldoTotal -= v;
      if(monthKey(t.date)===curMonth){
        if(t.type==='receita') receitasMes+=v; else despesasMes+=v;
      }
    });
    return {receitasMes, despesasMes, saldoTotal, clientesAtivos: state.clients.length};
  }

  function kpiCards(){
    const t = computeTotals();
    return `
      <div class="cards-row">

  function clientName(id){
    const c = state.clients.find(c=>c.id===id);
    return c ? c.name : '—';
  }

  function deptBreakdown(){
    return DEPARTMENTS.map(dep=>{
      const txs = state.transactions.filter(t=>t.department===dep);
      const receitas = txs.filter(t=>t.type==='receita').reduce((s,t)=>s+Number(t.value||0),0);
      const despesas = txs.filter(t=>t.type==='despesa').reduce((s,t)=>s+Number(t.value||0),0);
      const clientCount = new Set(txs.map(t=>t.clientId).filter(Boolean)).size;
      return `
        <div class="dcard">
          <div class="dname"><span class="tag ${deptClass(dep)}">${dep}</span></div>
          <div class="drow"><span>Clientes atendidos</span><strong>${clientCount}</strong></div>
          <div class="drow"><span>Receitas</span><strong>${fmtBRL(receitas)}</strong></div>
          <div class="drow"><span>Despesas</span><strong>${fmtBRL(despesas)}</strong></div>
        </div>
      `;
    }).join('');
  }

  function ringSvg(percent, colorHex){
    const p = Math.max(0, Math.min(100, percent));
    const r = 22, c = 2*Math.PI*r;
    const offset = c - (p/100)*c;
    return `
      <svg viewBox="0 0 56 56" width="56" height="56">
        <circle cx="28" cy="28" r="${r}" fill="none" stroke="#E4E7EC" stroke-width="6"/>
        <circle cx="28" cy="28" r="${r}" fill="none" stroke="${colorHex}" stroke-width="6" stroke-linecap="round"
          stroke-dasharray="${c}" stroke-dashoffset="${offset}" transform="rotate(-90 28 28)"/>
        <text x="28" y="32" text-anchor="middle" font-size="12" font-weight="700" font-family="Sora" fill="${colorHex}">${Math.round(p)}%</text>
      </svg>
    `;
  }

  function obligationsForTipoAndCompetencia(tipo, competencia){
    return state.obrigacoes.filter(o=>o.tipo===tipo && (o.vencimento||'').slice(0,7)===competencia);
  }
  function isClientInDept(clientId, deptName){
    if(!clientId) return false;
    const c = state.clients.find(x=>x.id===clientId);
    return !!(c && Array.isArray(c.departments) && c.departments.includes(deptName));
  }

  // Escopo de clientes marcados no seletor da página do departamento: "Todos os clientes"
  // (marcados todos de uma vez) ou uma seleção individual de um ou mais clientes específicos.
  function isClientInScope(clientId){
    if(!clientId) return false;
    if(state.deptAllClients) return true;
    return state.deptSelectedClients.includes(clientId);
  }

        <div class="cr-main">
          <div class="cr-title">${escapeHtml(o.categoria||o.titulo||'Obrigação')} ${o.titulo && o.categoria ? '— '+escapeHtml(o.titulo) : ''}</div>
          <div class="cr-meta">${escapeHtml(cliente)} · Vence ${fmtDate(o.vencimento)}${o.valor?' · '+fmtBRL(o.valor):''}</div>
        </div>
        <span class="tag ${obligationStatusClass(status)}">${status}</span>
        <div class="cr-actions">
          ${o.tipo==='Imposto' && o.clientId ? `<button type="button" class="cc-mini-btn" data-send-obg="${o.id}" title="Enviar guia ao cliente">✉ Enviar</button>` : ''}
          ${!o.concluded ? `<button type="button" class="cc-mini-btn done" data-toggle-obg="${o.id}">Marcar ${o.tipo==='Imposto'?'paga':'concluída'}</button>` : `<button type="button" class="cc-mini-btn" data-toggle-obg="${o.id}">Reabrir</button>`}

  function groupByClientHtml(list){
    if(!list.length) return '<div class="empty" style="padding:16px;">Nenhum lançamento nesta competência.</div>';
    const byClient = {};
    list.forEach(o=>{
      const cid = o.clientId || '—';
      if(!byClient[cid]) byClient[cid] = [];
      byClient[cid].push(o);
    });
    const clientIds = Object.keys(byClient).sort((a,b)=>{
      const na = a==='—' ? '' : clientName(a);
      const nb = b==='—' ? '' : clientName(b);
      return na.localeCompare(nb);
    });
    return clientIds.map(cid=>{
      const items = byClient[cid];
      const done = items.filter(o=>o.concluded).length;
      const name = cid==='—' ? 'Sem cliente vinculado' : clientName(cid);
      return `
        <div style="background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <div style="font-weight:700; font-size:13px; color:var(--ink);">${escapeHtml(name)}</div>
            <span class="tag ${done===items.length?'sit-ativa':'sit-pendente'}">${done}/${items.length}</span>
          </div>
          <div class="cc-list">${items.map(ccRowHtml).join('')}</div>
        </div>
      `;
    }).join('');
  }

  function folhaCardHtml(){
    const list = obligationsForTipoAndCompetencia('Folha de Pagamento', state.competenciaAtiva)
      .filter(o=> isClientInDept(o.clientId, 'Departamento Pessoal'))
      .filter(o=> state.ccClientFilter==='all' || o.clientId===state.ccClientFilter);
    const done = list.filter(o=>o.concluded).length;
    const pct = list.length ? (done/list.length*100) : 0;
    const byClient = {};
    list.forEach(o=>{
      const cid = o.clientId || '—';
      if(!byClient[cid]) byClient[cid] = {done:0, total:0};
      byClient[cid].total++;
      if(o.concluded) byClient[cid].done++;

    const clientRows = Object.keys(byClient).map(cid=>({
      name: cid==='—' ? 'Sem cliente vinculado' : clientName(cid),
      done: byClient[cid].done, total: byClient[cid].total,
    }));
    return `

  function competenciaOptionsHtml(){
    const opts = [];
    const now = new Date();
    for(let i=-6;i<=6;i++){
      const d = new Date(now.getFullYear(), now.getMonth()+i, 1);
      const val = d.toISOString().slice(0,7);
      opts.push(`<option value="${val}" ${val===state.competenciaAtiva?'selected':''}>${monthLabel(val)}/${val.slice(0,4)}</option>`);

  function obligationsOnDate(dateStr, clientFilter){
    return state.obrigacoes.filter(o=>o.vencimento===dateStr && (clientFilter==='all' || o.clientId===clientFilter));
  }

  function calendarGridHtml(){
    const year = state.calYear, month = state.calMonth;
    const first = new Date(year, month, 1);
    const startOffset = (first.getDay()+6)%7; // Monday=0
    const daysInMonth = new Date(year, month+1, 0).getDate();
    const todayS = todayStr();
    const cells = [];
    for(let i=0;i<startOffset;i++) cells.push('<div class="cal-day empty"></div>');
    for(let d=1; d<=daysInMonth; d++){
      const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const dayObs = obligationsOnDate(dateStr, state.calClientFilter);
      const depts = [...new Set(dayObs.map(o=>o.department || TIPO_TO_DEPT[o.tipo]))];
      const isToday = dateStr===todayS;
      const isSelected = dateStr===state.selectedCalDay;
      cells.push(`
        <div class="cal-day ${isToday?'today':''} ${isSelected?'selected':''}" data-cal-day="${dateStr}">
          <div class="cd-num">${d}</div>
          <div class="cd-dots">${depts.map(dp=>`<span class="dot" style="background:${deptDotColor(dp)}"></span>`).join('')}</div>
        </div>
      `);
    }
    return cells.join('');
  }
  function deptDotColor(dep){
    if(dep==='Departamento Pessoal') return '#5E35B1';
    if(dep==='Fiscal') return '#1B6FA8';
    if(dep==='Contábil') return '#0E8A72';
    if(dep==='Legal') return '#B2650A';
    return '#8896A3';
  }

    if(!state.selectedCalDay) return '';
    const list = obligationsOnDate(state.selectedCalDay, state.calClientFilter);

    return `
      <div class="cal-day-detail">
        <h4>Obrigações de ${dd}/${m}/${y} ${list.length ? '('+list.length+')' : ''}</h4>

  }

  function wireClientDeleteButtons(container){
    container.querySelectorAll('[data-del-client]').forEach(el=>{
      el.onclick = ()=>{ if(confirm('Excluir este cliente?')) deleteClient(el.getAttribute('data-del-client')); };
    });
    container.querySelectorAll('[data-view-client]').forEach(el=>{
      el.onclick = ()=>{ state.viewClientId = el.getAttribute('data-view-client'); state.modal='clientDetail'; render(); };
    });
    container.querySelectorAll('[data-edit-client]').forEach(el=>{
      el.onclick = ()=> openClientEditModal(el.getAttribute('data-edit-client'));
    });
  }
  function filteredClients(search, personType){
    return state.clients.filter(c=>
      (!personType || personType==='all' || c.personType===personType) &&
      matchesClientSearch(c, search)
    );
  }
  function clientsForDept(dept, search){
    const clientIds = new Set(state.transactions.filter(t=>t.department===dept && t.clientId).map(t=>t.clientId));
    return state.clients.filter(c=>clientIds.has(c.id) && matchesClientSearch(c, search));
  }
  function updateClientsResults(){
    const search = document.getElementById('clientSearchInput').value;
    state.clientSearch = search;
    const selectEl = document.getElementById('clientSelectFilter');
    if(selectEl) state.clientSelectFilter = selectEl.value;
    let list = filteredClients(search, state.clientTypeFilter);
    if(state.clientSelectFilter && state.clientSelectFilter !== 'all'){
      list = list.filter(c=>c.id===state.clientSelectFilter);

    const container = document.getElementById('clientsResultsContainer');
    container.innerHTML = clientsTableHtml(list, `Nenhum cliente encontrado${search?' para "'+escapeHtml(search)+'"':''}.`);
    wireClientDeleteButtons(container);
  }

  }

  function renderRelatorios(){
    const months = last6Months();
    const data = months.map(mk=>{
      let r=0,d=0;
      state.transactions.forEach(t=>{ if(monthKey(t.date)===mk){ if(t.type==='receita') r+=Number(t.value)||0; else d+=Number(t.value)||0; }});
      return {mk, r, d};
    });
    const max = Math.max(1, ...data.map(x=>Math.max(x.r,x.d)));
    const barW=34, gap=26, groupW=barW*2+10, chartH=180;
    const svgW = data.length*(groupW+gap);
    const bars = data.map((x,i)=>{
      const gx = i*(groupW+gap)+gap/2;
      const rh = (x.r/max)*chartH, dh=(x.d/max)*chartH;
      return `
        <g>
          <rect x="${gx}" y="${chartH-rh+20}" width="${barW}" height="${rh}" rx="4" fill="#2F7A52"/>
          <rect x="${gx+barW+6}" y="${chartH-dh+20}" width="${barW}" height="${dh}" rx="4" fill="#B23B3B"/>
          <text x="${gx+barW+3}" y="${chartH+42}" font-size="12" fill="#5B6B7A" text-anchor="middle" font-family="Inter">${monthLabel(x.mk)}</text>
        </g>
      `;
    }).join('');
    const t = computeTotals();
    return `
      <div class="panel">
        <div class="panel-head"><h3>Receitas x Despesas — últimos 6 meses</h3></div>
        <div class="chart-wrap">
          <svg viewBox="0 0 ${Math.max(svgW,320)} 230" style="width:100%;max-width:640px;">${bars}</svg>
        </div>
        <div class="legend"><span><i class="dot" style="background:#2F7A52"></i>Receitas</span><span><i class="dot" style="background:#B23B3B"></i>Despesas</span></div>
      </div>
      <div class="panel">
        <div class="panel-head"><h3>Resumo</h3></div>
        <table>
          <tbody>
            <tr><td>Total de receitas registradas</td><td style="text-align:right" class="val-cell receita mono">${fmtBRL(state.transactions.filter(t=>t.type==='receita').reduce((s,t)=>s+Number(t.value||0),0))}</td></tr>
            <tr><td>Total de despesas registradas</td><td style="text-align:right" class="val-cell despesa mono">${fmtBRL(state.transactions.filter(t=>t.type==='despesa').reduce((s,t)=>s+Number(t.value||0),0))}</td></tr>
            <tr><td><strong>Saldo total</strong></td><td style="text-align:right" class="mono"><strong>${fmtBRL(t.saldoTotal)}</strong></td></tr>
          </tbody>
        </table>
      </div>
    `;
  }

  function computeDeptTotals(dept){
    const now = new Date();
    const curMonth = now.toISOString().slice(0,7);
    let receitasMes=0, despesasMes=0, saldoTotal=0;
    const deptTx = state.transactions.filter(t=>t.department===dept);
    deptTx.forEach(t=>{
      const v = Number(t.value)||0;
      if(t.type==='receita') saldoTotal += v; else saldoTotal -= v;
      if(monthKey(t.date)===curMonth){
        if(t.type==='receita') receitasMes+=v; else despesasMes+=v;
      }
    });
    const clientCount = new Set(deptTx.map(t=>t.clientId).filter(Boolean)).size;
    return {receitasMes, despesasMes, saldoTotal, clientCount, deptTx};
  }

  function calcSimples(anexoKey, rbt12, receitaMes){
    const tabela = SIMPLES_TABELAS[anexoKey];
    let faixaIdx = tabela.findIndex(f=>rbt12 <= f.ate);
    if(faixaIdx === -1) faixaIdx = tabela.length - 1;
    const faixa = tabela[faixaIdx];
    const aliqEfetiva = rbt12 > 0 ? Math.max(0, (rbt12*faixa.aliq - faixa.deduz) / rbt12) : 0;
    const imposto = receitaMes * aliqEfetiva;
    return { faixaNum: faixaIdx+1, aliqNominal: faixa.aliq, deduz: faixa.deduz, aliqEfetiva, imposto };
  }

  // Soma o faturamento de um cliente num mês (YYYY-MM), a partir das Notas Fiscais registradas
  // com tipo de operação "Saída" (venda) ou "Serviços" (prestação) — notas de "Entrada" são
  // compras do cliente, não contam como faturamento dele para fins de apuração do Simples.
  function faturamentoNotasMes(clientId, competencia){
    if(!clientId || !competencia) return { total: 0, quantidade: 0 };
    const notas = state.notasFiscais.filter(n=>
      n.clientId === clientId &&
      (n.tipoOperacao === 'Saída' || n.tipoOperacao === 'Serviços') &&
      n.status !== 'Cancelada' &&
      (n.dataEmissao||'').slice(0,7) === competencia
    );
    return { total: notas.reduce((s,n)=>s+(Number(n.valor)||0), 0), quantidade: notas.length };
  }

  // RBT12: soma o faturamento dos 12 meses terminando na competência informada (inclusive) —
  // usado como referência para a Receita Bruta dos Últimos 12 Meses do Simples Nacional.
  function faturamentoNotas12Meses(clientId, competenciaFinal){
    if(!clientId || !competenciaFinal) return 0;
    const [ano, mes] = competenciaFinal.split('-').map(Number);
    let total = 0;
    for(let i=0; i<12; i++){
      const d = new Date(ano, mes-1-i, 1);
      const comp = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
      total += faturamentoNotasMes(clientId, comp).total;
    }
    return total;
  }

  // Lista de competências (YYYY-MM) entre duas datas, inclusive, em ordem crescente.
  function listaCompetencias(mesInicio, mesFim){
    if(!mesInicio || !mesFim) return [];
    const [anoI, mI] = mesInicio.split('-').map(Number);
    const [anoF, mF] = mesFim.split('-').map(Number);
    const lista = [];
    let ano = anoI, mes = mI;
    while(ano < anoF || (ano === anoF && mes <= mF)){
      lista.push(ano + '-' + String(mes).padStart(2,'0'));
      mes++;
      if(mes > 12){ mes = 1; ano++; }
    }
    return lista;
  }

  // Faturamento de um único cliente, mês a mês, dentro do período — separado por Vendas
  // (Saída) e Serviços, com o total de cada linha.
  function relatorioFaturamentoPorCompetencia(clientId, mesInicio, mesFim){
    const notasCliente = state.notasFiscais.filter(n => n.clientId === clientId && n.status !== 'Cancelada' && (n.tipoOperacao==='Saída' || n.tipoOperacao==='Serviços'));
    return listaCompetencias(mesInicio, mesFim).map(comp=>{
      const doMes = notasCliente.filter(n => (n.dataEmissao||'').slice(0,7) === comp);
      const vendas = doMes.filter(n=>n.tipoOperacao==='Saída').reduce((s,n)=>s+(Number(n.valor)||0),0);
      const servicos = doMes.filter(n=>n.tipoOperacao==='Serviços').reduce((s,n)=>s+(Number(n.valor)||0),0);
      return { competencia: comp, vendas, servicos, total: vendas+servicos, quantidade: doMes.length };
    });
  }

  // Faturamento agregado (soma do período todo) por cliente — para a visão "Todos os clientes".
  function relatorioFaturamentoPorCliente(mesInicio, mesFim){
    const competencias = new Set(listaCompetencias(mesInicio, mesFim));
    const porCliente = {};
    state.notasFiscais.forEach(n=>{
      if(n.status === 'Cancelada') return;
      if(n.tipoOperacao !== 'Saída' && n.tipoOperacao !== 'Serviços') return;
      if(!competencias.has((n.dataEmissao||'').slice(0,7))) return;
      if(!porCliente[n.clientId]) porCliente[n.clientId] = { clientId: n.clientId, vendas: 0, servicos: 0, quantidade: 0 };
      if(n.tipoOperacao === 'Saída') porCliente[n.clientId].vendas += Number(n.valor)||0;
      else porCliente[n.clientId].servicos += Number(n.valor)||0;
      porCliente[n.clientId].quantidade++;
    });
    return Object.values(porCliente).map(r=>({...r, clientName: clientName(r.clientId), total: r.vendas+r.servicos})).sort((a,b)=> b.total - a.total);
  }

  function calcPresumido(atividade, receitaTri, issPerc){
    const p = PRESUMIDO_ATIVIDADES[atividade];
    const baseIrpj = receitaTri * p.irpj;
    const baseCsll = receitaTri * p.csll;
    const irpjNormal = baseIrpj * 0.15;
    const excedente = Math.max(0, baseIrpj - 60000);
    const irpjAdicional = excedente * 0.10;
    const irpjTotal = irpjNormal + irpjAdicional;
    const csllTotal = baseCsll * 0.09;
    const pis = receitaTri * 0.0065;
    const cofins = receitaTri * 0.03;
    const iss = receitaTri * (issPerc/100);
    const total = irpjTotal + csllTotal + pis + cofins + iss;
    return { baseIrpj, baseCsll, irpjNormal, irpjAdicional, irpjTotal, csllTotal, pis, cofins, iss, total };
  }

  // Simulador comparativo simplificado da Reforma Tributária. Estima a carga de CBS+IBS
  // no regime pleno (2033) aplicando a alíquota de referência sobre a receita líquida de
  // créditos (receita × (1 - % de insumos com direito a crédito)) — uma aproximação da
  // não-cumulatividade, já que o cálculo exato depende do detalhamento de cada nota de compra.
  function calcReformaTributaria(params){
    const { faturamentoMensal, percCredito, aliqCBS, aliqIBS, anexoSimples } = params;
    const fat = Number(faturamentoMensal) || 0;
    const credito = Math.min(Math.max(Number(percCredito)||0, 0), 100) / 100;
    const baseNaoCumulativa = fat * (1 - credito);
    const aliqTotal = (Number(aliqCBS)||0)/100 + (Number(aliqIBS)||0)/100;

    // Lucro Real e Lucro Presumido: CBS/IBS não-cumulativos incidem igual para os dois —
    // a diferença entre eles está apenas no IRPJ/CSLL (Anexo/enquadramento), não no consumo.
    const ibsCbsRealPresumido = baseNaoCumulativa * aliqTotal;

    // Simples Nacional Normal (dentro do DAS): usa a tabela do Simples já calculada em "Cálculo
    // de Impostos" — aqui, uma estimativa simplificada usando a faixa 1 do anexo informado como
    // referência de alíquota efetiva do DAS (crédito repassado ao cliente fica limitado a essa fração).
    const anexoTabela = SIMPLES_TABELAS[anexoSimples];
    const aliqDasEstim = anexoTabela ? anexoTabela[0].aliq : 0.06;
    const dasEstimado = fat * aliqDasEstim;

    // Simples Nacional Híbrido: CBS/IBS saem do DAS e são apurados no regime regular igual ao
    // Real/Presumido (crédito integral ao cliente); o restante do DAS (IRPJ/CSLL/CPP) é estimado
    // removendo uma fração aproximada referente à antiga parcela de PIS/COFINS/ICMS/ISS do anexo.
    const fracaoConsumoNoAnexo = 0.45; // aproximação: parte do DAS hoje associada a PIS/COFINS/ICMS/ISS
    const dasRemanescente = dasEstimado * (1 - fracaoConsumoNoAnexo);
    const hibridoTotal = ibsCbsRealPresumido + dasRemanescente;

    return {
      baseNaoCumulativa, aliqTotal,
      lucroReal: { ibsCbs: ibsCbsRealPresumido, credito: true },
      lucroPresumido: { ibsCbs: ibsCbsRealPresumido, credito: true },
      simplesNormal: { das: dasEstimado, creditoRepassado: 'parcial (fração do DAS)' },
      simplesHibrido: { ibsCbs: ibsCbsRealPresumido, dasRemanescente, total: hibridoTotal, credito: true },
    };
  }

  // Sugere o próximo código disponível dentro da máscara de uma conta sintética (conta superior).
  // Ex: se a sintética é "1.1" e já existem "1.1.1" e "1.1.2", sugere "1.1.3".
  function suggestNextCodigo(contaSuperiorCodigo){
    if(!contaSuperiorCodigo) return '';
    const prefix = contaSuperiorCodigo + '.';
    const filhas = state.planoContas.filter(c => c.clientId===state.contabilEmpresaAtiva && c.codigo && c.codigo.startsWith(prefix) && c.codigo.slice(prefix.length).indexOf('.') === -1);
    let maxN = 0;
    filhas.forEach(c=>{
      const lastSeg = c.codigo.slice(prefix.length);
      const n = parseInt(lastSeg, 10);
      if(!isNaN(n) && n > maxN) maxN = n;
    });
    const next = maxN + 1;
    // Usa a mesma quantidade de dígitos já praticada pelas contas-irmãs existentes (sem forçar zero à esquerda quando elas não usam).
    const digits = filhas.length ? Math.max(...filhas.map(c=>c.codigo.slice(prefix.length).length)) : 0;
    return contaSuperiorCodigo + '.' + (digits > 1 ? String(next).padStart(digits, '0') : String(next));
  }

    const lancs = state.lancamentosContabeis.filter(l=>l.clientId===clientId && (l.contaDebito===contaId || l.contaCredito===contaId) && (!state.relDataInicio || l.data>=state.relDataInicio) && l.data<=state.relDataFim).sort((a,b)=>(a.data||'').localeCompare(b.data||''));
    let saldoAcum = state.relDataInicio ? saldoConta(conta, clientId, null, dataAnterior(state.relDataInicio)) : 0;
    const linhasHtml = lancs.map(l=>{
      const isDeb = l.contaDebito===contaId;
      const valorSigned = conta.natureza==='Devedora' ? (isDeb? l.valor : -l.valor) : (isDeb? -l.valor : l.valor);
      saldoAcum += Number(valorSigned)||0;
      return `<tr><td>${fmtDate(l.data)}</td><td>${escapeHtml(l.historico||'')}</td><td style="text-align:right" class="mono">${isDeb?fmtBRL(l.valor):''}</td><td style="text-align:right" class="mono">${!isDeb?fmtBRL(l.valor):''}</td><td style="text-align:right" class="mono">${fmtBRL(saldoAcum)}</td></tr>`;
    }).join('');
    return `
      <div class="form-hint" style="margin:14px 0 6px;">Razão da conta ${escapeHtml(conta.codigo)} — ${escapeHtml(conta.nome)}</div>
      <table>
        <thead><tr><th>Data</th><th>Histórico</th><th style="text-align:right">Débito</th><th style="text-align:right">Crédito</th><th style="text-align:right">Saldo</th></tr></thead>
        <tbody>${linhasHtml || '<tr><td colspan="5" style="text-align:center; color:var(--ink-soft);">Nenhum lançamento no período.</td></tr>'}</tbody>
      </table>
      <button type="button" class="btn-detail" id="pdfRazaoBtn" style="margin-top:12px;">Baixar PDF</button>
    `;
  }

  function faturamentoRelatorioHtml(){
    const allClients = state.clients.slice().sort((a,b)=>(a.name||'').localeCompare(b.name||''));
    const clienteId = state.faturamentoRelClienteId;
    const tipo = state.faturamentoRelTipo;

    const mostrarServicos = tipo === 'servicos' || tipo === 'ambos';

    let conteudo = '';
    if(clienteId === 'all'){
      const linhas = relatorioFaturamentoPorCliente(mesInicio, mesFim);
      const totalGeral = linhas.reduce((s,l)=> s + (mostrarVendas?l.vendas:0) + (mostrarServicos?l.servicos:0), 0);
      conteudo = !linhas.length ? `<div class="empty">Nenhuma nota de Saída/Serviços encontrada no período.</div>` : `
        <table>
          <thead><tr><th>Cliente</th>${mostrarVendas?'<th style="text-align:right">Vendas</th>':''}${mostrarServicos?'<th style="text-align:right">Serviços</th>':''}<th style="text-align:right">Total</th></tr></thead>

            ${linhas.map(l=>`
              <tr>
                <td>${escapeHtml(l.clientName)}</td>
                ${mostrarVendas?`<td style="text-align:right" class="mono">${fmtBRL(l.vendas)}</td>`:''}
                ${mostrarServicos?`<td style="text-align:right" class="mono">${fmtBRL(l.servicos)}</td>`:''}
                <td style="text-align:right" class="mono">${fmtBRL((mostrarVendas?l.vendas:0)+(mostrarServicos?l.servicos:0))}</td>
              </tr>
            `).join('')}
            <tr class="conta-sintetica"><td>Total geral</td>${mostrarVendas?'<td></td>':''}${mostrarServicos?'<td></td>':''}<td style="text-align:right">${fmtBRL(totalGeral)}</td></tr>

      const linhas = relatorioFaturamentoPorCompetencia(clienteId, mesInicio, mesFim);

      conteudo = !linhas.length ? `<div class="empty">Selecione um período válido.</div>` : `
        <table>
          <thead><tr><th>Competência</th>${mostrarVendas?'<th style="text-align:right">Vendas</th>':''}${mostrarServicos?'<th style="text-align:right">Serviços</th>':''}<th style="text-align:right">Total</th><th style="text-align:right">Nº notas</th></tr></thead>

              <tr>

                <td style="text-align:right">${l.quantidade}</td>
              </tr>
            `).join('')}
            <tr class="conta-sintetica"><td>Total do período</td>${mostrarVendas?'<td></td>':''}${mostrarServicos?'<td></td>':''}<td style="text-align:right">${fmtBRL(totalGeral)}</td><td></td></tr>
          </tbody>
        </table>
      `;

    return `
      <div class="form-section-title">Relatório de Faturamento Mensal</div>
      <div class="form-hint" style="margin:-4px 0 14px;">Consulta o faturamento por competência, a partir das notas de Saída (vendas) e Serviços já cadastradas — notas de Entrada (compras) não entram na conta.</div>

        <div class="field"><label>Empresa</label>

            <option value="all" ${clienteId==='all'?'selected':''}>Todos os clientes</option>
            ${allClients.map(c=>`<option value="${c.id}" ${clienteId===c.id?'selected':''}>${escapeHtml(c.name)}</option>`).join('')}

        <div class="field"><label>Tipo</label>
          <select id="fatRelTipo">
            <option value="ambos" ${tipo==='ambos'?'selected':''}>Vendas + Serviços</option>
            <option value="vendas" ${tipo==='vendas'?'selected':''}>Só Vendas</option>
            <option value="servicos" ${tipo==='servicos'?'selected':''}>Só Serviços</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="field"><label>Competência inicial</label><input type="month" id="fatRelMesInicio" value="${mesInicio}"/></div>
        <div class="field"><label>Competência final</label><input type="month" id="fatRelMesFim" value="${mesFim}"/></div>

  function wireUsersTableButtons(container){
    container.querySelectorAll('[data-edit-access]').forEach(el=>{

        state.modal='userAccess'; render();
      };
    });
    container.querySelectorAll('[data-del-user]').forEach(el=>{
      el.onclick = ()=>{ if(confirm('Excluir este usuário? Ele perderá o acesso ao sistema.')) deleteUser(el.getAttribute('data-del-user')); };

              <div class="field"><label>Valor dos honorários (R$)</label><input type="number" step="0.01" min="0" id="clContractValue" value="${d.contractValue!==undefined&&d.contractValue!==''?d.contractValue:''}"/></div>
              <div class="field"><label>Periodicidade</label><select id="clContractPeriodicity">${optHtml(CONTRACT_PERIOD_OPTIONS, d.contractPeriodicity||'Mensal')}</select></div>
            </div>
            <div class="field"><label>Status do contrato</label><select id="clContractStatus">${optHtml(CONTRACT_STATUS_OPTIONS, d.contractStatus||'Ativo')}</select></div>
            <div class="field"><label>Objeto / observações do contrato</label><textarea id="clContractNotes" rows="3" style="width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:13.5px;font-family:inherit;resize:vertical;">${escapeHtml(d.contractNotes||'')}</textarea></div>

            <div class="modal-actions">
              <button type="button" class="btn-sm" id="clCancel">Cancelar</button>
              <button type="submit" class="btn-add">${d.id ? 'Salvar alterações' : 'Salvar'}</button>
            </div>
          </form>
        </div>
      </div>
    `;
  }

  function renderApp(){

    else if(state.view==='clientes') content = renderClientes();

      </div>

      ${state.modal==='userAccess' ? userAccessModalHtml() : ''}

      ${state.modal==='parc' ? parcModalHtml() : ''}

    `;

    root.querySelectorAll('[data-nav]').forEach(el=>{

        if(DEPT_VIEW_MAP[target] && !userHasDeptAccess(state.user, DEPT_VIEW_MAP[target])) return;
        if(target==='admin') await loadUsers();

    const logoutBtn = document.getElementById('logoutBtn');

    const quickAdd = document.getElementById('quickAdd');

    const newClient = document.getElementById('newClient');

      state.clientModalData = {
        doc:'', name:'', phone:'', email:'', address:'', city:'', uf:'',
        situacao:'', mainActivity:'', lookupMsg:'', lookupType:'info', lookupLoading:false,
        personType:'', porte:'', regimeTributario:'', dataAbertura:'', secondaryActivities:'',
        capitalSocial:'', capitalIntegralizado:'', capitalAIntegralizar:'', socios:[],
        contractStart:'', contractEnd:'', contractValue:'', contractPeriodicity:'Mensal', contractStatus:'Ativo', contractNotes:'',
      };
      state.modal='client'; render();
    };

    root.querySelectorAll('[data-del-tx]').forEach(el=>{
      el.onclick = ()=>{ if(confirm('Excluir este lançamento?')) deleteTransaction(el.getAttribute('data-del-tx')); };

    root.querySelectorAll('[data-del-client]').forEach(el=>{

    root.querySelectorAll('[data-edit-client]').forEach(el=>{

    root.querySelectorAll('[data-type-tab]').forEach(el=>{

    });
    const clDetailClose = document.getElementById('clDetailClose');

    // Exportar / Importar Dados wiring
    const exportDataBtn = document.getElementById('exportDataBtn');
    if(exportDataBtn) exportDataBtn.onclick = ()=> exportAllData();
    const importDataInput = document.getElementById('importDataInput');
    if(importDataInput){

        const file = e.target.files && e.target.files[0];

    // Centro de Controle wiring
    const competenciaSelect = document.getElementById('competenciaSelect');

    const obgCancel = document.getElementById('obgCancel');
    if(obgCancel) obgCancel.onclick = ()=>{ state.modal=null; state.obrigacaoModalData=null; render(); };
    const obgForm = document.getElementById('obgForm');
    if(obgForm){
      obgForm.onsubmit = async (e)=>{
        e.preventDefault();
        const tipo = document.getElementById('obgTipo').value;
        const o = {
          tipo,
          clientId: document.getElementById('obgCliente').value || null,
          categoria: document.getElementById('obgCategoria').value,

          vencimento: document.getElementById('obgVencimento').value,

        await saveObrigacao(o);
        if(tipo === 'Imposto' && o.clientId){
          const resultado = await gerarLancamentoImposto(o);
          if(resultado.ok){
            alert('Guia salva. ' + resultado.geradas + ' lançamento(s) contábil(is) gerado(s) automaticamente no Depto Contábil.');
          } else if(resultado.motivo === 'sem-plano-de-contas'){
          alert('Guia/lançamento salvo, mas esta empresa ainda não tem um Plano de Contas próprio cadastrado. Vá em Plano de Contas, selecione a empresa e clique em "Criar plano de contas padrão para esta empresa" antes de gerar lançamentos automáticos.');
        } else if(resultado.faltando && resultado.faltando.length){
            alert('Guia salva, mas não foi possível gerar o lançamento automático: conta não encontrada no Plano de Contas (' + resultado.faltando.join(', ') + ').');
          }
        }
      };

    const novoAvisoBtn = document.getElementById('novoAvisoBtn');

      state.modal='aviso'; render();
    };
    root.querySelectorAll('[data-del-aviso]').forEach(el=>{

    });
    const avCancel = document.getElementById('avCancel');
    if(avCancel) avCancel.onclick = ()=>{ state.modal=null; state.avisoModalData=null; render(); };
    const avisoForm = document.getElementById('avisoForm');

      avisoForm.onsubmit = (e)=>{

          titulo: document.getElementById('avTitulo').value,

          data: document.getElementById('avData').value,
          texto: document.getElementById('avTexto').value,

        };
        state.modal=null; state.avisoModalData=null;
        render();
        saveAviso(a);
      };
    }

    // Mensagens Padrão wiring
    const novaMensagemBtn = document.getElementById('novaMensagemBtn');

      state.msgTemplateData = { nome:'', canal:'whatsapp', assunto:'', corpo:'' };
      state.modal='msgTemplate'; render();
    };
    root.querySelectorAll('[data-edit-msg]').forEach(el=>{
      el.onclick = ()=>{
        const m = state.mensagens.find(x=>x.id===el.getAttribute('data-edit-msg'));
        if(!m) return;
        state.msgTemplateData = Object.assign({}, m);
        state.modal='msgTemplate'; render();
      };
    });
    root.querySelectorAll('[data-del-msg]').forEach(el=>{
      el.onclick = ()=>{ if(confirm('Excluir esta mensagem padrão?')) deleteMensagem(el.getAttribute('data-del-msg')); };
    });
    const mtCancel = document.getElementById('mtCancel');
    if(mtCancel) mtCancel.onclick = ()=>{ state.modal=null; state.msgTemplateData=null; render(); };
    const msgTemplateForm = document.getElementById('msgTemplateForm');
    if(msgTemplateForm){
      msgTemplateForm.onsubmit = (e)=>{
        e.preventDefault();
        const m = Object.assign({}, state.msgTemplateData, {
          nome: document.getElementById('mtNome').value,
          canal: document.getElementById('mtCanal').value,
          assunto: document.getElementById('mtAssunto').value,

        });
        state.modal=null; state.msgTemplateData=null;
        render();
        saveMensagem(m);
      };
    }

    root.querySelectorAll('[data-use-msg]').forEach(el=>{
      el.onclick = ()=>{
        state.msgSendData = { templateId: el.getAttribute('data-use-msg'), clientId:'', values:{}, attachments:[] };
        state.modal='msgSend'; render();
      };
    });
    root.querySelectorAll('[data-send-obg]').forEach(el=>{
      el.onclick = ()=>{
        const o = state.obrigacoes.find(x=>x.id===el.getAttribute('data-send-obg'));
        if(!o) return;
        const whatsTpl = state.mensagens.find(m=>m.canal==='whatsapp') || state.mensagens[0];
        const compDate = o.vencimento ? o.vencimento.slice(0,7) : state.competenciaAtiva;
        state.msgSendData = {
          templateId: whatsTpl ? whatsTpl.id : null,
          clientId: o.clientId || '',
          attachments: [],
          values: {
            NOME_IMPOSTO: o.categoria || '',
            COMPETENCIA: monthLabel(compDate) + '/' + compDate.slice(0,4),
            VALOR_IMPOSTO: o.valor ? fmtNumberBR(o.valor) : '',
            VENCIMENTO: o.vencimento ? fmtDate(o.vencimento) : '',
          },
        };
        state.modal='msgSend'; render();
      };
    });
    const msgSendTemplateSel = document.getElementById('msgSendTemplate');
    if(msgSendTemplateSel) msgSendTemplateSel.onchange = (e)=>{

      state.msgSendData.templateId = e.target.value;
      render();
    };
    const msgSendClienteSel = document.getElementById('msgSendCliente');
    if(msgSendClienteSel) msgSendClienteSel.onchange = (e)=>{
      if(!state.msgSendData) return;
      state.msgSendData.clientId = e.target.value;
      render();
    };
    function updateMsgSendPreview(){
      if(!state.msgSendData) return;
      const tpl = state.mensagens.find(m=>m.id===state.msgSendData.templateId) || state.mensagens[0];
      if(!tpl) return;
      document.querySelectorAll('[data-ph-input]').forEach(inp=>{
        state.msgSendData.values[inp.getAttribute('data-ph-input')] = inp.value;
      });
      const renderedBody = renderMsgTemplate(tpl.corpo, state.msgSendData.values);
      const renderedSubject = renderMsgTemplate(tpl.assunto, state.msgSendData.values);
      const preview = document.getElementById('msgSendPreview');
      if(preview){
        preview.innerHTML = (tpl.canal==='email' ? ('<strong>Assunto:</strong> '+escapeHtml(renderedSubject)+'\n\n') : '') + escapeHtml(renderedBody);
      }
    }
    document.querySelectorAll('[data-ph-input]').forEach(inp=>{
      inp.oninput = updateMsgSendPreview;
    });
    const msgAttachInput = document.getElementById('msgAttachInput');
    if(msgAttachInput){
      msgAttachInput.onchange = (e)=>{
        if(!state.msgSendData) return;
        if(!state.msgSendData.attachments) state.msgSendData.attachments = [];
        const newFiles = Array.from(e.target.files || []).map(f=>({name:f.name, size:f.size, type:f.type||'—'}));
        state.msgSendData.attachments = state.msgSendData.attachments.concat(newFiles);
        const container = document.getElementById('attachListContainer');
        if(container) container.innerHTML = attachListHtml(state.msgSendData.attachments);
        wireAttachRemoveButtons();
        e.target.value = '';
      };
    }
    function wireAttachRemoveButtons(){
      document.querySelectorAll('[data-remove-attach]').forEach(btn=>{
        btn.onclick = ()=>{
          const idx = parseInt(btn.getAttribute('data-remove-attach'),10);
          state.msgSendData.attachments.splice(idx,1);
          const container = document.getElementById('attachListContainer');
          if(container) container.innerHTML = attachListHtml(state.msgSendData.attachments);
          wireAttachRemoveButtons();
        };
      });
    }
    wireAttachRemoveButtons();

    const msgSendSystem = document.getElementById('msgSendSystem');
    if(msgSendSystem) msgSendSystem.onclick = async ()=>{
      const tpl = state.mensagens.find(m=>m.id===state.msgSendData.templateId) || state.mensagens[0];
      const client = state.clients.find(c=>c.id===state.msgSendData.clientId);
      if(!client){ alert('Selecione um cliente para enviar.'); return; }
      const text = renderMsgTemplate(tpl.corpo, state.msgSendData.values);
      const subject = renderMsgTemplate(tpl.assunto, state.msgSendData.values);
      const attachments = state.msgSendData.attachments || [];

      if(tpl.canal==='whatsapp'){
        if(!client.phone){ alert('Este cliente não tem telefone cadastrado.'); return; }
      } else {
        if(!client.email){ alert('Este cliente não tem email cadastrado.'); return; }

        clientId: client.id,
        templateId: tpl.id,
        templateNome: tpl.nome,
        canal: tpl.canal,
        texto: text,
        assunto: subject,
        attachments: attachments,
        sentAt: new Date().toISOString(),
        sentBy: state.user ? state.user.email : '',
      });

      if(tpl.canal==='whatsapp'){
        const phone = waPhoneDigits(client.phone);
        window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(text), '_blank');
      } else {
        window.location.href = 'mailto:'+encodeURIComponent(client.email)+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(text);
      }

      const banner = document.getElementById('sendConfirmBanner');
      if(banner){
        banner.textContent = 'Registrado no histórico do sistema' + (attachments.length ? ' com '+attachments.length+' anexo(s) listado(s)' : '') + '. A janela de ' + (tpl.canal==='whatsapp'?'WhatsApp':'Email') + ' foi aberta — anexe os arquivos manualmente lá, se necessário.';
        banner.classList.add('show');
      }
      const histContainer = document.getElementById('enviosHistContainer');
      if(histContainer){
        histContainer.innerHTML = enviosHistoricoHtml(state.msgSendData.clientId);
      }
    };
    const msgSendCopy = document.getElementById('msgSendCopy');
    if(msgSendCopy) msgSendCopy.onclick = async ()=>{
      const tpl = state.mensagens.find(m=>m.id===state.msgSendData.templateId) || state.mensagens[0];
      const text = renderMsgTemplate(tpl.corpo, state.msgSendData.values);
      try{
        await navigator.clipboard.writeText(text);
        msgSendCopy.textContent = 'Copiado!';
        setTimeout(()=>{ msgSendCopy.textContent = 'Copiar texto'; }, 1500);
      }catch(e){
        alert('Não foi possível copiar automaticamente. Selecione o texto manualmente.');
      }

    const msgSendCancel = document.getElementById('msgSendCancel');

    // ===== Comunicados aos Clientes =====

    const comCliente = document.getElementById('comCliente');
    if(comCliente) comCliente.onchange = (e)=>{ state.comunicadoClienteId = e.target.value; render(); };
    const comAssunto = document.getElementById('comAssunto');
    if(comAssunto) comAssunto.onchange = (e)=>{ state.comunicadoAssunto = e.target.value; render(); };
    const comCorpo = document.getElementById('comCorpo');
    if(comCorpo) comCorpo.onchange = (e)=>{ state.comunicadoCorpo = e.target.value; render(); };

    const comEnviarIndividualBtn = document.getElementById('comEnviarIndividualBtn');
    if(comEnviarIndividualBtn){
      comEnviarIndividualBtn.onclick = async ()=>{

        if(!client){ alert('Selecione um cliente.'); return; }
        const texto = comunicadoRenderTexto(state.comunicadoCorpo, client);
        const assunto = comunicadoRenderTexto(state.comunicadoAssunto, client);
        if(state.comunicadoCanal==='whatsapp'){
          if(!client.phone){ alert('Este cliente não tem telefone cadastrado.'); return; }
        } else if(!client.email){ alert('Este cliente não tem email cadastrado.'); return; }
        await saveEnvio({ clientId: client.id, canal: state.comunicadoCanal, texto, assunto, isComunicado:true, sentAt: new Date().toISOString(), sentBy: state.user?state.user.email:'' });
        if(state.comunicadoCanal==='whatsapp'){
          window.open('https://wa.me/'+waPhoneDigits(client.phone)+'?text='+encodeURIComponent(texto), '_blank');
        } else {
          window.location.href = 'mailto:'+encodeURIComponent(client.email)+'?subject='+encodeURIComponent(assunto)+'&body='+encodeURIComponent(texto);
        }
        render();
      };
    }
    const comEnviarTodosEmailBtn = document.getElementById('comEnviarTodosEmailBtn');
    if(comEnviarTodosEmailBtn){
      comEnviarTodosEmailBtn.onclick = async ()=>{
        const elegiveis = state.clients.filter(c=>!!c.email);
        if(!elegiveis.length){ alert('Nenhum cliente com email cadastrado.'); return; }
        for(const client of elegiveis){
          await saveEnvio({ clientId: client.id, canal:'email', texto: comunicadoRenderTexto(state.comunicadoCorpo, client), assunto: state.comunicadoAssunto, isComunicado:true, sentAt: new Date().toISOString(), sentBy: state.user?state.user.email:'' });
        }
        const bcc = elegiveis.map(c=>c.email).join(',');
        window.location.href = 'mailto:?bcc='+encodeURIComponent(bcc)+'&subject='+encodeURIComponent(state.comunicadoAssunto)+'&body='+encodeURIComponent(state.comunicadoCorpo);
        render();
      };
    }
    root.querySelectorAll('[data-com-enviar-whats]').forEach(el=>{
      el.onclick = async ()=>{
        const clientId = el.getAttribute('data-com-enviar-whats');
        const client = state.clients.find(c=>c.id===clientId);
        if(!client || !client.phone) return;
        const texto = comunicadoRenderTexto(state.comunicadoCorpo, client);
        await saveEnvio({ clientId: client.id, canal:'whatsapp', texto, assunto:'', isComunicado:true, sentAt: new Date().toISOString(), sentBy: state.user?state.user.email:'' });
        window.open('https://wa.me/'+waPhoneDigits(client.phone)+'?text='+encodeURIComponent(texto), '_blank');
        if(!state.comunicadoFilaEnviados.includes(clientId)) state.comunicadoFilaEnviados.push(clientId);
        render();
      };
    });

            status: result.status,
            anexoNome: file.name,
            xmlHash,
            observacoes: 'Importado em lote via XML (' + file.name + ')',

          ok++;

        await loadNotasFiscais();
        const parts = [ok + ' nota(s) importada(s) e salva(s)'];

        const telefone = info.ddd_telefone_1 ? info.ddd_telefone_1 : '';
        state.clientModalData.name = razao || fantasia || state.clientModalData.name;
        state.clientModalData.phone = telefone || state.clientModalData.phone;
        state.clientModalData.email = info.email || state.clientModalData.email;
        state.clientModalData.address = enderecoFull || state.clientModalData.address;
        state.clientModalData.city = info.municipio || state.clientModalData.city;
        state.clientModalData.uf = info.uf || state.clientModalData.uf;
        state.clientModalData.situacao = info.descricao_situacao_cadastral || '';
        state.clientModalData.mainActivity = info.cnae_fiscal_descricao || '';
        state.clientModalData.personType = 'PJ';
        state.clientModalData.porte = info.descricao_porte || state.clientModalData.porte;
        state.clientModalData.regimeTributario = info.opcao_pelo_mei ? 'MEI' : (info.opcao_pelo_simples ? 'Simples Nacional' : state.clientModalData.regimeTributario);
        state.clientModalData.dataAbertura = info.data_inicio_atividade || state.clientModalData.dataAbertura;
        state.clientModalData.secondaryActivities = Array.isArray(info.cnaes_secundarios) ? info.cnaes_secundarios.map(a=>a.descricao).filter(Boolean).join('; ') : state.clientModalData.secondaryActivities;
        state.clientModalData.capitalSocial = (info.capital_social !== undefined && info.capital_social !== null) ? info.capital_social : state.clientModalData.capitalSocial;
        if(Array.isArray(info.qsa) && info.qsa.length){
          state.clientModalData.socios = info.qsa.map(s=>({
            nome: s.nome_socio || '',
            cpf: s.cnpj_cpf_do_socio || '',
            rg: '',
            cargo: s.qualificacao_socio || '',
            endereco: '',
            bairro: '',
            cidade: '',
            estado: '',
            regimeCasamento: '',
            percentual: '',
            retiraProLabore: '',
          }));
        }
        state.clientModalData.lookupMsg = 'Dados encontrados na Receita Federal e preenchidos automaticamente. Confira e ajuste se necessário. Os dados dos sócios trazidos pela Receita são limitados (CPF parcialmente oculto) — complete manualmente RG, endereço, regime de casamento e pró-labore.';
        state.clientModalData.lookupType = 'success';
        render();
      };
    }

    const clientForm = document.getElementById('clientForm');
    if(clientForm){
      clientForm.onsubmit = (e)=>{
        e.preventDefault();
        const doc = document.getElementById('clDoc').value;
        const explicitPersonType = document.getElementById('clPersonType').value;
        const c = {
          id: (state.clientModalData && state.clientModalData.id) || undefined,
          name: document.getElementById('clName').value,
          doc,
          personType: explicitPersonType || personTypeFromDoc(doc),
          porte: document.getElementById('clPorte').value,
          regimeTributario: document.getElementById('clRegime').value,
          dataAbertura: document.getElementById('clDataAbertura').value,
          mainActivity: document.getElementById('clMainActivity').value,
          secondaryActivities: document.getElementById('clSecondaryActivities').value,
          phone: document.getElementById('clPhone').value,
          email: document.getElementById('clEmail').value,
          address: document.getElementById('clAddress').value,
          city: document.getElementById('clCity').value,
          uf: document.getElementById('clUf').value,
          departments: Array.from(document.querySelectorAll('.cl-dept-check:checked')).map(el=>el.value),
          situacao: (state.clientModalData && state.clientModalData.situacao) || '',
          capitalSocial: document.getElementById('clCapitalSocial').value,
          capitalIntegralizado: document.getElementById('clCapitalIntegralizado').value,
          capitalAIntegralizar: document.getElementById('clCapitalAIntegralizar').value,
          socios: (state.clientModalData && state.clientModalData.socios) || [],
          contractStart: document.getElementById('clContractStart').value,
          contractEnd: document.getElementById('clContractEnd').value,
          contractValue: document.getElementById('clContractValue').value,
          contractPeriodicity: document.getElementById('clContractPeriodicity').value,
          contractStatus: document.getElementById('clContractStatus').value,
          contractNotes: document.getElementById('clContractNotes').value,
        };
        state.modal=null;
        state.clientModalData=null;
        render();
        saveClient(c);
      };
    }
  }

  function render(){
    if(state.loading){
      document.getElementById('jp-root').innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:#5B6B7A;font-family:Inter,sans-serif;">Carregando...</div>`;
      return;
    }
    if(!state.user){ renderAuth(); } else { renderApp(); }
  }

  (async function boot(){
    render(); // show the loading screen immediately while we connect to storage
    await initStore();
    trySession();
  })();
})();
</script>
</body>
</html>
