<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --navy-deep:#0F2740;
    --navy:#1B3A5C;
    --navy-soft:#274966;
    --gold:#C89B3C;
    --gold-light:#E3C069;
    --bg:#F3F4F7;
    --card:#FFFFFF;
    --ink:#16232E;
    --ink-soft:#5B6B7A;
    --line:#E4E7EC;
    --green:#2F7A52;
    --green-bg:#E7F3EC;
    --red:#B23B3B;
    --red-bg:#FBEAEA;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;}
  #jp-root{min-height:100vh;position:relative;}
  ::selection{background:var(--gold-light);}
  input,select,button,textarea{font-family:inherit;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .h-display{font-family:'Sora',sans-serif;}

  /* ---------- LOGIN ---------- */
  .auth-wrap{min-height:100vh;display:flex;}
  .auth-side{
    width:44%;min-width:340px;background:linear-gradient(160deg,var(--navy-deep),var(--navy) 65%);
    color:#fff;display:flex;flex-direction:column;justify-content:space-between;
    padding:48px 44px;position:relative;overflow:hidden;
  }
  .auth-side::after{
    content:"";position:absolute;inset:0;
    background:radial-gradient(circle at 80% 10%, rgba(200,155,60,0.18), transparent 45%);
    pointer-events:none;
  }
  .brand-badge{display:flex;align-items:center;gap:14px;}
  .brand-badge img{width:54px;height:54px;border-radius:12px;object-fit:cover;background:#fff;}
  .brand-badge .name{font-family:'Sora',sans-serif;font-weight:700;font-size:17px;letter-spacing:.3px;line-height:1.15;}
  .brand-badge .name span{display:block;color:var(--gold-light);font-size:13px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;margin-top:2px;}

  .auth-hero{margin-top:60px;}
  .auth-hero h1{font-family:'Sora',sans-serif;font-size:34px;line-height:1.2;font-weight:800;margin:0 0 14px;}
  .auth-hero p{color:#C9D6E3;font-size:15px;line-height:1.6;max-width:380px;margin:0;}

  .ascend-graphic{margin-top:44px;}
  .ascend-graphic svg{width:100%;max-width:380px;display:block;}
  .bar{transform-origin:bottom;animation:rise 1.1s cubic-bezier(.2,.8,.2,1) both;}
  .bar1{animation-delay:.05s;} .bar2{animation-delay:.18s;} .bar3{animation-delay:.31s;}
  @keyframes rise{from{transform:scaleY(0);opacity:0;}to{transform:scaleY(1);opacity:1;}}
  .arrow-path{stroke-dasharray:340;stroke-dashoffset:340;animation:draw 1s ease-out .5s forwards;}
  @keyframes draw{to{stroke-dashoffset:0;}}
  @media (prefers-reduced-motion: reduce){ .bar,.arrow-path{animation:none !important;stroke-dashoffset:0;transform:scaleY(1);opacity:1;} }

  .auth-foot{font-size:12px;color:#8FA3B8;letter-spacing:.3px;}

  .auth-main{flex:1;display:flex;align-items:center;justify-content:center;padding:32px;}
  .auth-form{width:100%;max-width:380px;}
  .auth-form h2{font-family:'Sora',sans-serif;font-size:24px;font-weight:700;margin:0 0 6px;}
  .auth-form .sub{color:var(--ink-soft);font-size:14px;margin:0 0 28px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;letter-spacing:.2px;text-transform:uppercase;}
  .field input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:14.5px;color:var(--ink);background:#fff;transition:border-color .15s,box-shadow .15s;}
  .field input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(200,155,60,.15);}
  .btn-primary{width:100%;padding:13px;border:none;border-radius:10px;background:var(--navy);color:#fff;font-weight:700;font-size:14.5px;cursor:pointer;letter-spacing:.2px;transition:background .15s,transform .1s;}
  .btn-primary:hover{background:var(--navy-soft);}
  .btn-primary:active{transform:scale(.99);}
  .btn-gold{background:var(--gold);color:var(--navy-deep);}
  .btn-gold:hover{background:var(--gold-light);}
  .auth-switch{margin-top:22px;font-size:13.5px;color:var(--ink-soft);text-align:center;}
  .auth-switch a{color:var(--navy);font-weight:600;cursor:pointer;text-decoration:none;}
  .auth-switch a:hover{text-decoration:underline;}
  .auth-error{background:var(--red-bg);color:var(--red);padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none;}
  .auth-error.show{display:block;}
  .auth-note{margin-top:18px;font-size:11.5px;color:#9AA7B2;line-height:1.5;}

  /* ---------- APP SHELL ---------- */
  .app-shell{display:flex;min-height:100vh;}
  .sidebar{width:232px;background:var(--navy-deep);color:#fff;display:flex;flex-direction:column;padding:26px 18px;flex-shrink:0;}
  .sb-brand{display:flex;align-items:center;gap:10px;padding:0 6px 22px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:18px;}
  .sb-brand img{width:38px;height:38px;border-radius:9px;background:#fff;object-fit:cover;}
  .sb-brand .t{font-family:'Sora',sans-serif;font-weight:700;font-size:14px;line-height:1.2;}
  .sb-brand .t span{display:block;color:var(--gold-light);font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;font-weight:600;margin-top:1px;}
  .sb-nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto;}
  .sb-item{display:flex;align-items:flex-start;gap:11px;padding:9px 12px;border-radius:9px;color:#B9C6D3;cursor:pointer;transition:background .15s,color .15s;user-select:none;}
  .sb-item svg{width:17px;height:17px;flex-shrink:0;margin-top:1px;}
  .sb-item:hover{background:rgba(255,255,255,.06);color:#fff;}
  .sb-item.active{background:var(--gold);color:var(--navy-deep);}
  .sb-item.active svg{stroke:var(--navy-deep);}
  .sb-item.sb-dept-pessoal svg{stroke:#9B7FE0;}
  .sb-item.sb-dept-fiscal svg{stroke:#5FA8D3;}
  .sb-item.sb-dept-contabil svg{stroke:#4FC3A8;}
  .sb-item.sb-dept-legal svg{stroke:#E0A05C;}
  .sb-item.active.sb-dept-pessoal{background:#5E35B1;color:#fff;}
  .sb-item.active.sb-dept-fiscal{background:#1B6FA8;color:#fff;}
  .sb-item.active.sb-dept-contabil{background:#0E8A72;color:#fff;}
  .sb-item.active.sb-dept-legal{background:#B2650A;color:#fff;}
  .sb-item.active.sb-dept-pessoal svg,.sb-item.active.sb-dept-fiscal svg,.sb-item.active.sb-dept-contabil svg,.sb-item.active.sb-dept-legal svg{stroke:#fff;}
  .sb-text{display:flex;flex-direction:column;min-width:0;}
  .sb-title{font-size:13px;font-weight:700;line-height:1.25;}
  .sb-subtitle{font-size:10.5px;font-weight:500;opacity:.62;line-height:1.3;margin-top:1px;}
  .sb-item.active .sb-subtitle{opacity:.72;}
  .sb-section-label{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#5E7387;padding:14px 12px 6px;}
  .sb-section-label:first-child{padding-top:2px;}
  .sb-foot{border-top:1px solid rgba(255,255,255,.08);padding-top:14px;margin-top:10px;}
  .sb-user{font-size:12px;color:#9AB0C2;margin-bottom:10px;word-break:break-all;}
  .sb-logout{width:100%;padding:9px;border-radius:8px;border:1px solid rgba(255,255,255,.15);background:transparent;color:#DDE5EC;font-size:12.5px;font-weight:600;cursor:pointer;}
  .sb-logout:hover{background:rgba(255,255,255,.08);}

  .main{flex:1;min-width:0;padding:30px 38px 50px;}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:26px;}
  .topbar h1{font-family:'Sora',sans-serif;font-size:23px;font-weight:800;margin:0 0 4px;}
  .topbar .date{color:var(--ink-soft);font-size:13px;}

  .cards-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:26px;}
  .kpi{background:var(--card);border-radius:var(--radius);padding:18px 20px;border:1px solid var(--line);}
  .kpi .lbl{font-size:12px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px;}
  .kpi .val{font-family:'IBM Plex Mono',monospace;font-size:21px;font-weight:600;}
  .kpi.pos .val{color:var(--green);}
  .kpi.neg .val{color:var(--red);}

  .panel{background:var(--card);border-radius:var(--radius);border:1px solid var(--line);padding:22px;margin-bottom:20px;}
  .panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .panel-head h3{font-family:'Sora',sans-serif;font-size:16px;font-weight:700;margin:0;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;color:var(--ink-soft);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;padding:8px 10px;border-bottom:1.5px solid var(--line);}
  td{padding:11px 10px;border-bottom:1px solid var(--line);}
  tr:last-child td{border-bottom:none;}
  .tag{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;}
  .tag.receita{background:var(--green-bg);color:var(--green);}
  .tag.despesa{background:var(--red-bg);color:var(--red);}
  .tag.dept-pessoal{background:#EDE7F6;color:#5E35B1;}
  .tag.dept-fiscal{background:#E1F0FA;color:#1B6FA8;}
  .tag.dept-contabil{background:#E1F5F0;color:#0E8A72;}
  .tag.dept-legal{background:#FCEFE0;color:#B2650A;}
  .tag.role-admin{background:var(--gold-light);color:var(--navy-deep);}
  .tag.role-user{background:#EDEFF2;color:var(--ink-soft);}
  .filter-select{padding:8px 12px;border:1.5px solid var(--line);border-radius:9px;font-size:13px;background:#fff;color:var(--ink);}
  .dept-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px;}
  .dept-summary .dcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;}
  .dept-summary .dcard .dname{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;margin-bottom:8px;}
  .dept-summary .dcard .drow{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-soft);margin-top:4px;}
  .dept-summary .dcard .drow strong{color:var(--ink);font-family:'IBM Plex Mono',monospace;}

  .cnpj-lookup{display:flex;gap:8px;align-items:flex-start;}
  .cnpj-lookup .field{flex:1;margin-bottom:0;}
  .btn-lookup{padding:12px 16px;border:none;border-radius:10px;background:var(--gold);color:var(--navy-deep);font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;height:44px;}
  .btn-lookup:hover{background:var(--gold-light);}
  .btn-lookup:disabled{opacity:.6;cursor:default;}
  .lookup-msg{font-size:12.5px;margin:8px 0 0;padding:9px 12px;border-radius:8px;}
  .lookup-msg.info{background:#EEF2F6;color:var(--ink-soft);}
  .lookup-msg.error{background:var(--red-bg);color:var(--red);}
  .lookup-msg.success{background:var(--green-bg);color:var(--green);}
  .lookup-preview{background:#F8F9FB;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:12.5px;color:var(--ink-soft);line-height:1.6;margin-top:10px;}
  .tag.tipo-pj{background:#E3ECF7;color:var(--navy);}
  .tag.tipo-pf{background:#F3EAF9;color:#7B3FA0;}
  .form-section-title{font-family:'Sora',sans-serif;font-size:13px;font-weight:700;color:var(--navy);margin:20px 0 12px;padding-top:16px;border-top:1px solid var(--line);}
  .form-section-title:first-child{margin-top:0;padding-top:0;border-top:none;}
  .form-hint{font-size:11.5px;color:var(--ink-soft);margin:-8px 0 14px;}
  .socios-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
  .socio-row{display:flex;justify-content:space-between;align-items:flex-start;background:#F8F9FB;border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:12.5px;}
  .socio-row .si-name{font-weight:700;color:var(--ink);}
  .socio-row .si-meta{color:var(--ink-soft);font-size:11.5px;margin-top:2px;line-height:1.5;}
  .socio-row .si-remove{border:none;background:transparent;color:var(--red);cursor:pointer;font-size:16px;line-height:1;padding:2px 6px;flex-shrink:0;}
  .add-socio-form{background:#F8F9FB;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:14px;}
  .add-socio-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px;}
  .add-socio-grid .mini-field label{display:block;font-size:10.5px;font-weight:600;color:var(--ink-soft);margin-bottom:4px;text-transform:uppercase;}
  .add-socio-grid .mini-field input,.add-socio-grid .mini-field select{width:100%;padding:9px 10px;border:1.5px solid var(--line);border-radius:8px;font-size:12.5px;}
  .add-socio-actions{display:flex;justify-content:flex-end;}
  .btn-add-socio{padding:9px 14px;border:none;border-radius:8px;background:var(--navy);color:#fff;font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap;}
  .btn-add-socio:hover{background:var(--navy-soft);}
  .cap-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  .detail-modal{max-width:560px;}
  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px;margin-bottom:6px;}
  .detail-item .dl{font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;color:var(--ink-soft);font-weight:700;margin-bottom:3px;}
  .detail-item .dv{font-size:13.5px;color:var(--ink);}
  .detail-full{grid-column:1 / -1;}
  .btn-detail{padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:12px;font-weight:600;cursor:pointer;color:var(--navy);}
  .btn-detail:hover{background:#F0F4F8;}
  @media (max-width:640px){ .add-socio-grid{grid-template-columns:1fr 1fr;} .cap-row{grid-template-columns:1fr;} .detail-grid{grid-template-columns:1fr;} }

  /* ---------- CENTRO DE CONTROLE ---------- */
  .cc-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:18px;}
  .cc-header h2{font-family:'Sora',sans-serif;font-size:18px;font-weight:800;margin:0;display:flex;align-items:center;gap:8px;}
  .cc-competencia{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--ink-soft);}
  .cc-competencia select{padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;font-size:12.5px;background:#fff;}
  .cc-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;}
  .cc-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;}
  .cc-card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:4px;}
  .cc-card-title{font-family:'Sora',sans-serif;font-size:14px;font-weight:700;}
  .cc-card-sub{font-size:11.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.3px;font-weight:700;margin-bottom:2px;}
  .cc-ring-wrap{display:flex;align-items:center;gap:14px;}
  .cc-ring-label{font-size:12.5px;color:var(--ink-soft);}
  .cc-ring-label strong{color:var(--ink);font-family:'IBM Plex Mono',monospace;}
  .cc-list{margin-top:14px;display:flex;flex-direction:column;gap:8px;max-height:220px;overflow-y:auto;}
  .cc-row{display:flex;justify-content:space-between;align-items:center;background:#F8F9FB;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:12.5px;gap:8px;}
  .cc-row .cr-main{min-width:0;}
  .cc-row .cr-title{font-weight:700;color:var(--ink);}
  .cc-row .cr-meta{color:var(--ink-soft);font-size:11px;margin-top:2px;}
  .cc-row .cr-actions{display:flex;gap:6px;flex-shrink:0;}
  .cc-mini-btn{border:none;background:transparent;cursor:pointer;font-size:11.5px;font-weight:700;padding:4px 8px;border-radius:6px;}
  .cc-mini-btn.done{color:var(--green);} .cc-mini-btn.done:hover{background:var(--green-bg);}
  .cc-mini-btn.del{color:var(--red);} .cc-mini-btn.del:hover{background:var(--red-bg);}
  .tag.sit-pendente{background:#FDF3E0;color:#B5790A;}
  .btn-cc-add{padding:7px 12px;border-radius:8px;border:none;background:var(--navy);color:#fff;font-size:11.5px;font-weight:700;cursor:pointer;}
  .btn-cc-add:hover{background:var(--navy-soft);}

  .cal-toolbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
  .cal-nav{display:flex;align-items:center;gap:10px;}
  .cal-nav button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:14px;color:var(--navy);}
  .cal-nav button:hover{background:#F0F4F8;}
  .cal-nav .cal-month-label{font-family:'Sora',sans-serif;font-weight:700;font-size:14px;min-width:150px;text-align:center;}
  .cal-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--ink-soft);margin-bottom:14px;}
  .cal-legend span{display:inline-flex;align-items:center;gap:5px;}
  .cal-legend .dot{width:8px;height:8px;border-radius:50%;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-dow{font-size:10.5px;font-weight:700;color:var(--ink-soft);text-align:center;text-transform:uppercase;padding-bottom:4px;}
  .cal-day{min-height:64px;border:1px solid var(--line);border-radius:9px;padding:6px;cursor:pointer;transition:background .15s,border-color .15s;background:#fff;}
  .cal-day:hover{border-color:var(--gold);}
  .cal-day.empty{background:transparent;border:none;cursor:default;}
  .cal-day.today{border-color:var(--navy);border-width:2px;}
  .cal-day.selected{background:#FDF6E8;border-color:var(--gold);}
  .cal-day .cd-num{font-size:12px;font-weight:700;color:var(--ink);}
  .cal-day .cd-dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:5px;}
  .cal-day .cd-dots .dot{width:6px;height:6px;border-radius:50%;}
  .cal-day-detail{margin-top:18px;}
  .cal-day-detail h4{font-family:'Sora',sans-serif;font-size:14px;margin:0 0 12px;}

  .avisos-list{display:flex;flex-direction:column;gap:10px;}
  .aviso-card{background:#F8F9FB;border:1px solid var(--line);border-radius:10px;padding:12px 14px;}
  .aviso-card.pinned{border-color:var(--gold);background:#FFFBF0;}
  .aviso-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:5px;}
  .aviso-title{font-weight:700;font-size:13.5px;color:var(--ink);}
  .aviso-date{font-size:11px;color:var(--ink-soft);white-space:nowrap;}
  .aviso-text{font-size:12.5px;color:var(--ink-soft);line-height:1.5;}
  .tag.aviso-prazo{background:var(--red-bg);color:var(--red);}
  .tag.aviso-legislacao{background:#E1F0FA;color:#1B6FA8;}
  .tag.aviso-comunicado{background:var(--green-bg);color:var(--green);}
  .tag.aviso-outro{background:#EDEFF2;color:var(--ink-soft);}
  .rf-link{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--navy);text-decoration:none;}
  .rf-link:hover{text-decoration:underline;}
  @media (max-width:900px){ .cc-grid{grid-template-columns:1fr;} .cal-day{min-height:48px;} }

  /* ---------- MENSAGENS PADRÃO ---------- */
  .msg-list{display:flex;flex-direction:column;gap:10px;}
  .msg-card{background:#F8F9FB;border:1px solid var(--line);border-radius:10px;padding:12px 14px;}
  .msg-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap;}
  .msg-title{font-weight:700;font-size:13.5px;color:var(--ink);}
  .tag.tag-canal-whats{background:#E4F7EC;color:#1E9E5A;}
  .tag.tag-canal-email{background:#E1F0FA;color:#1B6FA8;}
  .msg-preview{font-size:12px;color:var(--ink-soft);line-height:1.5;white-space:pre-line;max-height:60px;overflow:hidden;}
  .msg-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .msg-send-preview{background:#F8F9FB;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--ink);white-space:pre-line;line-height:1.6;margin:12px 0;max-height:220px;overflow-y:auto;}
  .msg-placeholder-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .btn-send-whats{background:#1E9E5A;color:#fff;}
  .btn-send-whats:hover{background:#178048;}
  .btn-send-email{background:#1B6FA8;color:#fff;}
  .btn-send-email:hover{background:#155A87;}
  .btn-copy{background:#fff;color:var(--ink);border:1px solid var(--line);}
  .btn-copy:hover{background:#F0F4F8;}
  .btn-send-system{background:var(--gold);color:var(--navy-deep);}
  .btn-send-system:hover{background:var(--gold-light);}

  .attach-box{border:1.5px dashed var(--line);border-radius:10px;padding:12px 14px;margin:12px 0;}
  .attach-input-row{display:flex;align-items:center;gap:10px;}
  .attach-input-row input[type=file]{font-size:12px;flex:1;}
  .attach-list{display:flex;flex-direction:column;gap:6px;margin-top:10px;}
  .attach-item{display:flex;justify-content:space-between;align-items:center;background:#F8F9FB;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;}
  .attach-item .ai-name{color:var(--ink);font-weight:600;word-break:break-all;}
  .attach-item .ai-size{color:var(--ink-soft);font-size:10.5px;margin-left:6px;}
  .attach-item .ai-remove{border:none;background:transparent;color:var(--red);cursor:pointer;font-size:14px;}
  .send-note{font-size:11.5px;color:var(--ink-soft);background:#FDF3E0;border:1px solid #F0DBA8;border-radius:8px;padding:8px 11px;margin:10px 0;line-height:1.5;}
  .send-confirm{font-size:12px;color:var(--green);background:var(--green-bg);border-radius:8px;padding:8px 11px;margin:10px 0;display:none;}
  .send-confirm.show{display:block;}
  .envios-hist{display:flex;flex-direction:column;gap:8px;margin-top:14px;max-height:220px;overflow-y:auto;}
  .envio-row{background:#F8F9FB;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:12px;}
  .envio-row .er-top{display:flex;justify-content:space-between;gap:8px;}
  .envio-row .er-cliente{font-weight:700;color:var(--ink);}
  .envio-row .er-when{color:var(--ink-soft);font-size:11px;}
  .envio-row .er-meta{color:var(--ink-soft);margin-top:3px;}

  /* ---------- CALCULADORA DE IMPOSTOS / SITUAÇÃO FISCAL ---------- */
  .calc-tabs{display:flex;gap:6px;margin-bottom:18px;}
  .calc-result{background:#F8F9FB;border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-top:16px;}
  .calc-result .cr-line{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px dashed var(--line);}
  .calc-result .cr-line:last-child{border-bottom:none;}
  .calc-result .cr-line.total{font-weight:700;font-size:14.5px;color:var(--navy);border-top:1.5px solid var(--line);margin-top:6px;padding-top:10px;}
  .calc-result .cr-line span:last-child{font-family:'IBM Plex Mono',monospace;}
  .calc-disclaimer{font-size:11.5px;color:var(--ink-soft);background:#FDF3E0;border:1px solid #F0DBA8;border-radius:8px;padding:9px 12px;margin-top:14px;line-height:1.5;}
  .btn-calc{padding:11px 20px;border:none;border-radius:9px;background:var(--navy);color:#fff;font-weight:700;font-size:13px;cursor:pointer;}
  .btn-calc:hover{background:var(--navy-soft);}
  .portal-links{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px;}

  /* ---------- DP - PESSOAL (FOLHA, FÉRIAS, RESCISÃO) ---------- */
  .dp-tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;}
  .dp-tab-btn{padding:9px 15px;border-radius:9px;border:1.5px solid var(--line);background:#fff;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--ink-soft);transition:all .15s;}
  .dp-tab-btn:hover{border-color:var(--gold);}
  .dp-tab-btn.active{background:var(--navy);border-color:var(--navy);color:#fff;}
  .payroll-result{background:#F8F9FB;border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-top:16px;}
  .payroll-result .pr-line{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px dashed var(--line);}
  .payroll-result .pr-line:last-child{border-bottom:none;}
  .payroll-result .pr-line.total{font-weight:700;font-size:14.5px;color:var(--navy);border-top:1.5px solid var(--line);margin-top:6px;padding-top:10px;}
  .payroll-result .pr-line.neg span:last-child{color:var(--red);}
  .payroll-result .pr-line span:last-child{font-family:'IBM Plex Mono',monospace;}
  .legis-note{font-size:11.5px;color:var(--ink-soft);background:#EEF2F6;border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin-top:14px;line-height:1.5;}
  .conta-sintetica{font-weight:700;background:#F0F4F8;}
  .conta-nivel-1{padding-left:0;}
  .conta-nivel-2{padding-left:16px;}
  .conta-nivel-3{padding-left:32px;}
  .tag.natureza-devedora{background:#E1F0FA;color:#1B6FA8;}
  .tag.natureza-credora{background:#FCEFE0;color:#B2650A;}
  .lanc-row{display:flex;justify-content:space-between;align-items:center;background:#F8F9FB;border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:8px;font-size:12.5px;}
  .lanc-row .lr-partidas{color:var(--ink-soft);font-size:11.5px;margin-top:3px;}
  .parc-progress{width:100%;height:6px;background:#E4E7EC;border-radius:3px;overflow:hidden;margin-top:4px;}
  .parc-progress-fill{height:100%;background:var(--gold);border-radius:3px;}

  .sitfiscal-split{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px;}
  .sitfiscal-card{background:#F8F9FB;border:1px solid var(--line);border-radius:10px;padding:16px 18px;}
  .sitfiscal-card h4{font-family:'Sora',sans-serif;font-size:13.5px;font-weight:700;margin:0 0 8px;display:flex;align-items:center;gap:7px;}
  .sitfiscal-card .sf-badge{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .sitfiscal-card .sf-badge.federal{background:#1B6FA8;}
  .sitfiscal-card .sf-badge.estadual{background:#0E8A72;}
  .sitfiscal-card p{font-size:12px;color:var(--ink-soft);line-height:1.5;margin:0 0 12px;}
  .sitfiscal-card .portal-links{margin-bottom:0;flex-direction:column;gap:8px;}
  @media (max-width:700px){ .sitfiscal-split{grid-template-columns:1fr;} }
  .lookup-preview strong{color:var(--ink);}
  .tag.sit-ativa{background:var(--green-bg);color:var(--green);}
  .tag.sit-baixada{background:var(--red-bg);color:var(--red);}
  .tag.sit-outra{background:#EDEFF2;color:var(--ink-soft);}
  .cnpj-divider{border:none;border-top:1px solid var(--line);margin:16px 0;}
  .spinner{display:inline-block;width:13px;height:13px;border:2px solid rgba(15,39,64,.25);border-top-color:var(--navy-deep);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .dept-tabs{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap;}
  .dept-tab-btn{padding:9px 16px;border-radius:9px;border:1.5px solid var(--line);background:#fff;font-size:13px;font-weight:700;cursor:pointer;color:var(--ink-soft);transition:all .15s;}
  .dept-tab-btn:hover{border-color:var(--gold);}
  .dept-tab-btn.active{background:var(--navy);border-color:var(--navy);color:#fff;}

  .search-box{position:relative;flex:1;max-width:340px;}
  .search-box svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--ink-soft);pointer-events:none;}
  .search-box input{width:100%;padding:10px 12px 10px 36px;border:1.5px solid var(--line);border-radius:10px;font-size:13.5px;color:var(--ink);background:#fff;}
  .search-box input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(200,155,60,.15);}
  .panel-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .val-cell{font-family:'IBM Plex Mono',monospace;font-weight:600;}
  .val-cell.receita{color:var(--green);} .val-cell.despesa{color:var(--red);}

  .btn-sm{padding:7px 13px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink);}
  .btn-sm:hover{background:#F6F7F9;}
  .btn-sm.danger{color:var(--red);border-color:#F0D3D3;}
  .btn-sm.danger:hover{background:var(--red-bg);}
  .btn-add{padding:9px 16px;border-radius:9px;border:none;background:var(--navy);color:#fff;font-size:13px;font-weight:700;cursor:pointer;}
  .btn-add:hover{background:var(--navy-soft);}

  .empty{text-align:center;padding:40px 10px;color:var(--ink-soft);font-size:13.5px;}

  .modal-bg{position:fixed;inset:0;background:rgba(15,39,64,.45);display:flex;align-items:center;justify-content:center;z-index:50;}
  .modal{background:#fff;border-radius:16px;padding:26px;width:100%;max-width:420px;max-height:88vh;overflow-y:auto;overflow-x:hidden;word-wrap:break-word;overflow-wrap:break-word;}
  .modal.modal-wide{max-width:640px;}
  .modal h3{font-family:'Sora',sans-serif;font-size:17px;margin:0 0 18px;}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .modal-actions{display:flex;gap:10px;margin-top:20px;}
  .modal-actions .btn-sm, .modal-actions .btn-add{flex:1;text-align:center;}

  select{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;background:#fff;color:var(--ink);}

  .chart-wrap{position:relative;}
  .legend{display:flex;gap:18px;margin-top:14px;font-size:12.5px;color:var(--ink-soft);}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}

  @media (max-width:900px){
    .cards-row{grid-template-columns:repeat(2,1fr);}
    .auth-side{display:none;}
    .sidebar{width:76px;padding:20px 10px;}
    .sb-item span.lbl-text{display:none;}
    .sb-brand .t{display:none;}
    .main{padding:22px 16px;}
    .form-row{grid-template-columns:1fr;}
  }
</style>
</head>

  // ============================================================================
  // TABELAS TRABALHISTAS/PREVIDENCIÁRIAS VIGENTES EM 2026
  // INSS: Portaria Interministerial MPS/MF nº 13/2026. IRRF: tabela tradicional
  // (Lei 11.482, atualizada por MP em 2025) + redutor da Lei 15.270/2025.
  // ============================================================================
  const SALARIO_MINIMO_2026 = 1621.00;
  const TETO_INSS_2026 = 8475.55;
  const INSS_FAIXAS_2026 = [
    {min:0, max:1621.00, aliq:0.075},
    {min:1621.00, max:2902.84, aliq:0.09},
    {min:2902.84, max:4354.27, aliq:0.12},
    {min:4354.27, max:8475.55, aliq:0.14},
  ];
  const IRRF_FAIXAS_2026 = [
    {max:2428.80, aliq:0, deduz:0},
    {max:2826.65, aliq:0.075, deduz:182.16},
    {max:3751.05, aliq:0.15, deduz:394.16},
    {max:4664.68, aliq:0.225, deduz:675.49},
    {max:Infinity, aliq:0.275, deduz:908.73},
  ];
  const IRRF_DEDUCAO_DEPENDENTE_2026 = 189.59;
  const FGTS_ALIQUOTA = 0.08;

  function round2(n){ return Math.round((n + Number.EPSILON) * 100) / 100; }

  function calcINSS(salarioBruto){
    const sal = Math.min(Math.max(salarioBruto,0), TETO_INSS_2026);
    let total = 0;
    for(const f of INSS_FAIXAS_2026){
      if(sal > f.min){
        total += (Math.min(sal, f.max) - f.min) * f.aliq;
      }
    }
    return round2(total);
  }

  function calcIRRFTradicional(baseCalculo){
    const base = Math.max(baseCalculo, 0);
    for(const f of IRRF_FAIXAS_2026){
      if(base <= f.max){
        return round2(Math.max(0, base*f.aliq - f.deduz));
      }
    }
    return 0;
  }

  // Aplica o redutor de 2026 (Lei 15.270/2025) sobre o rendimento bruto mensal:
  // isenção total até R$5.000, redução parcial até R$7.350, tabela cheia acima disso.
  function calcIRRF(baseCalculo, rendimentoBruto){
    const irTrad = calcIRRFTradicional(baseCalculo);
    if(rendimentoBruto <= 5000) return 0;
    let redutor = 0;
    if(rendimentoBruto <= 7350){
      redutor = Math.max(0, 978.62 - 0.133145*rendimentoBruto);
    }
    return round2(Math.max(0, irTrad - redutor));
  }

  function calcFGTS(salarioBruto){ return round2(salarioBruto * FGTS_ALIQUOTA); }

  // Folha de pagamento mensal de um funcionário.
  function calcFolha(salarioBase, outrosProventos, dependentes, outrosDescontos){
    const bruto = round2((Number(salarioBase)||0) + (Number(outrosProventos)||0));
    const inss = calcINSS(bruto);
    const baseIrrf = bruto - inss - (Number(dependentes)||0)*IRRF_DEDUCAO_DEPENDENTE_2026;
    const irrf = calcIRRF(baseIrrf, bruto);
    const descontosExtra = Number(outrosDescontos)||0;
    const liquido = round2(bruto - inss - irrf - descontosExtra);
    const fgts = calcFGTS(bruto);
    return { bruto, inss, irrf, descontosExtra, liquido, fgts };
  }

  // Cálculo de férias (Art. 129 a 145 da CLT).
  function calcFerias(salarioBase, diasGozo, diasVendidos, dependentes){
    const sal = Number(salarioBase)||0;
    const gozo = Math.min(Math.max(Number(diasGozo)||0, 0), 30);
    const vendidos = Math.min(Math.max(Number(diasVendidos)||0, 0), 10);
    const valorDiaria = sal/30;
    const valorFeriasGozo = round2(valorDiaria * gozo);
    const tercoGozo = round2(valorFeriasGozo/3);
    const valorAbono = round2(valorDiaria * vendidos);
    const tercoAbono = round2(valorAbono/3);
    // INSS e IRRF incidem sobre férias gozadas + 1/3; o abono pecuniário (dias vendidos) é isento.
    const baseTributavel = round2(valorFeriasGozo + tercoGozo);
    const inss = calcINSS(baseTributavel);
    const baseIrrf = baseTributavel - inss - (Number(dependentes)||0)*IRRF_DEDUCAO_DEPENDENTE_2026;
    const irrf = calcIRRF(baseIrrf, baseTributavel);
    const totalBruto = round2(valorFeriasGozo + tercoGozo + valorAbono + tercoAbono);
    const totalLiquido = round2(totalBruto - inss - irrf);
    return { valorFeriasGozo, tercoGozo, valorAbono, tercoAbono, baseTributavel, inss, irrf, totalBruto, totalLiquido };
  }

  // Cálculo de rescisão contratual — cobre os tipos mais comuns.
  // Aviso prévio proporcional: 30 dias + 3 dias por ano completo de casa (art. 1º, Lei 12.506/2011), máx. 90 dias.
  function calcAvisoPrevioDias(anosCasa){
    return Math.min(30 + Math.floor(Math.max(anosCasa,0))*3, 90);
  }
  function calcRescisao(params){
    const {
      salarioBase, dependentes, tipoRescisao, avisoPrevio,
      diasSaldoSalario, mesesFeriasVencidas, mesesProporcionaisFerias, mesesProporcionais13,
      anosCasa, saldoFgtsInformado,
    } = params;
    const sal = Number(salarioBase)||0;
    const dep = Number(dependentes)||0;
    const valorDiaria = sal/30;

    const saldoSalario = round2(valorDiaria * (Number(diasSaldoSalario)||0));

    // Férias vencidas (período aquisitivo completo não gozado) — só se aplica quando informado (12 meses completos).
    const feriasVencidasVal = Number(mesesFeriasVencidas) >= 12 ? round2(sal) : 0;
    const tercoFeriasVencidas = round2(feriasVencidasVal/3);

    // Férias proporcionais (avos do período aquisitivo em curso).
    const avosFerias = Math.min(Number(mesesProporcionaisFerias)||0, 12);
    const feriasProporcionais = round2(sal/12 * avosFerias);
    const tercoFeriasProporcionais = round2(feriasProporcionais/3);

    // 13º salário proporcional.
    const avos13 = Math.min(Number(mesesProporcionais13)||0, 12);
    const decimoTerceiroProporcional = round2(sal/12 * avos13);

    // Aviso prévio.
    let avisoPrevioValor = 0, diasAviso = 0;
    if(avisoPrevio === 'Indenizado'){
      diasAviso = calcAvisoPrevioDias(anosCasa);
      avisoPrevioValor = round2(valorDiaria * diasAviso);
    }

    // Multa do FGTS: 40% (sem justa causa) ou 20% (acordo mútuo, Art. 484-A CLT). Sobre o saldo informado.
    const saldoFgts = Number(saldoFgtsInformado)||0;
    let percMulta = 0;
    if(tipoRescisao === 'Sem justa causa') percMulta = 0.40;
    else if(tipoRescisao === 'Acordo mútuo (Art. 484-A)') percMulta = 0.20;
    const multaFgts = round2(saldoFgts * percMulta);

    // Verbas que sofrem retenção de INSS/IRRF: saldo de salário + 13º proporcional (férias são isentas de INSS,
    // mas o IRRF sobre férias segue a mesma lógica do cálculo de férias em folha à parte).
    const baseInss = round2(saldoSalario + decimoTerceiroProporcional);
    const inss = calcINSS(baseInss);
    const baseIrrf = baseInss - inss - dep*IRRF_DEDUCAO_DEPENDENTE_2026;
    const irrf = calcIRRF(baseIrrf, baseInss);

    const totalBruto = round2(
      saldoSalario + feriasVencidasVal + tercoFeriasVencidas + feriasProporcionais + tercoFeriasProporcionais +
      decimoTerceiroProporcional + avisoPrevioValor + multaFgts
    );
    const totalLiquido = round2(totalBruto - inss - irrf);

    return {
      saldoSalario, feriasVencidas: feriasVencidasVal, tercoFeriasVencidas,
      feriasProporcionais, tercoFeriasProporcionais, decimoTerceiroProporcional,
      avisoPrevioValor, diasAviso, multaFgts, inss, irrf, totalBruto, totalLiquido,
    };
  }


  function sitFiscalClass(status){
    if(status==='Regular') return 'sit-ativa';

  // Extrai todo o texto de um PDF (funciona com PDFs baseados em texto, como os relatórios
  // oficiais de situação fiscal — não funciona com PDFs escaneados como imagem, sem OCR).
  async function extractPdfText(file){
    if(!window.pdfjsLib) throw new Error('Biblioteca de leitura de PDF ainda não carregou. Tente novamente em instantes.');
    const buf = await file.arrayBuffer();
    const pdf = await window.pdfjsLib.getDocument({data: buf}).promise;
    let fullText = '';
    for(let i=1; i<=pdf.numPages; i++){
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      fullText += content.items.map(it=>it.str).join(' ') + '\n';
    }
    return fullText;
  }

  // Interpreta relatórios de "Situação Fiscal" baixados oficialmente da Receita Federal
  // (Informações de Apoio para Emissão de Certidão) ou de portais de Sefaz/Prefeitura.

  // Extrai as linhas de pendências/débitos das tabelas do relatório (Receita, período,
  // vencimento e valor consolidado), lidando com a quebra de linha/espaçamento irregular
  // que o PDF costuma gerar ao extrair o texto de uma tabela.
  function parseDebitoRows(text){
    const rows = [];
    const norm = text.replace(/[ \t]*\n[ \t]*/g, ' ').replace(/\s+/g, ' ') + ' ZZZFIM';

    // Divide o texto em seções por cabeçalho conhecido, para saber a situação padrão de
    // cada linha mesmo quando a palavra "DEVEDOR" não vem explícita no texto extraído do
    // PDF (acontece em alguns layouts, onde a coluna de situação fica "escondida" atrás de
    // outro texto, como "Notificação de lançamento").
    const marcadoresSecao = [
      {regex: /Pend[êe]ncia\s*-\s*D[ée]bito\s*\(SIEF\)/i, situacaoPadrao: 'DEVEDOR'},
      {regex: /D[ée]bito com Exigibilidade Suspensa/i, situacaoPadrao: 'A VENCER'},
      {regex: /Pend[êe]ncia\s*-\s*Parcelamento/i, situacaoPadrao: 'PARCELADO'},
    ];
    let marcas = [];
    marcadoresSecao.forEach(ms=>{
      const re = new RegExp(ms.regex.source, 'gi');
      let match;
      while((match = re.exec(norm)) !== null){ marcas.push({index: match.index + match[0].length, situacaoPadrao: ms.situacaoPadrao}); }
    });
    marcas.sort((a,b)=> a.index - b.index);
    const secoes = [];
    if(marcas.length){
      for(let i=0;i<marcas.length;i++){
        const inicio = marcas[i].index;
        const fim = i+1<marcas.length ? marcas[i+1].index : norm.length;
        secoes.push({ texto: norm.slice(inicio, fim), situacaoPadrao: marcas[i].situacaoPadrao });
      }
    } else {
      secoes.push({ texto: norm, situacaoPadrao: null });
    }

    // Aceita competência em três formatos: "Nº TRIM/AAAA", "MM/AAAA" ou uma data completa
    // "DD/MM/AAAA" (alguns layouts usam data completa na coluna PA/Exerc.). A situação
    // (DEVEDOR etc.) é opcional no texto — quando ausente, usa o padrão da seção.
    const rowRe = /(\d{3,4}-\d{2})\s*-\s*([A-ZÀ-Ú][A-ZÀ-Ú0-9\.\-\/ ]*?)\s+((?:\d{1,2}º\s*TRIM\/\d{4})|(?:\d{1,2}\/\d{1,2}\/\d{4})|(?:\d{1,2}\/\d{4}))\s+(\d{2}\/\d{2}\/\d{4})\s+((?:[\d.,]+\s+){2,5}?)(DEVEDOR|A ANALISAR[A-ZÀ-Ú\- ]*?VENCER|PARCELADO|SUSPENSO)?(?=\s*\d{3,4}-\d{2}\s*-|\s*Notifica[çc][ãa]o|\s*[A-ZÀ-Ú][a-zà-ú]|\s*_|\s*ZZZFIM)/g;

    secoes.forEach(sec=>{
      let m;
      rowRe.lastIndex = 0;
      while((m = rowRe.exec(sec.texto)) !== null){
        const nums = m[5].trim().split(/\s+/).map(parseBRNumber);
        const situacao = m[6] ? m[6].trim() : (sec.situacaoPadrao || '');
        // Tabela de Pendência-Débito (SIEF) traz até 5 colunas: Vl.Original, Sdo.Devedor, Multa,
        // Juros, Sdo.Dev.Cons. Tabela de Exigibilidade Suspensa traz só 2 (Vl.Original, Sdo.Devedor).
        // Alguns layouts trazem só 3 (sem Juros/Consolidado explícitos no texto extraído) — nesse
        // caso o valor usado é Sdo.Devedor + Multa (pode ficar levemente subestimado se houver
        // juros não capturados no texto do PDF).
        let valorOriginal, multa, juros, valor;
        if(nums.length >= 5){
          valorOriginal = nums[0]; multa = nums[2]; juros = nums[3]; valor = nums[4];
        } else if(nums.length === 3){
          valorOriginal = nums[0]; multa = nums[2]; juros = 0; valor = round2(nums[1]+nums[2]);
        } else {
          valorOriginal = nums[0]||0; multa = 0; juros = 0; valor = nums.length ? nums[nums.length-1] : 0;
        }
        rows.push({
          codigo: m[1], nome: m[2].trim().replace(/\.$/,''), periodo: m[3], vencimento: m[4],
          valorOriginal, multa, juros, valor, situacao, categoria: classificarVencimento(situacao, m[4]),
        });
      }
    });
    return rows;
  }


  // Classifica cada pendência como Vencido ou A Vencer — primeiro pela própria palavra do
  // relatório (DEVEDOR = já vencido; "A VENCER" = ainda não venceu); se não achar nenhuma das
  // duas, usa a data de vencimento comparada a hoje como critério de apoio.
  function classificarVencimento(situacao, vencimentoStr){
    if(/DEVEDOR/i.test(situacao)) return 'Vencido';
    if(/VENCER/i.test(situacao)) return 'A Vencer';
    const partes = (vencimentoStr||'').split('/');
    if(partes.length === 3){
      const venc = new Date(+partes[2], +partes[1]-1, +partes[0]);
      return venc < new Date() ? 'Vencido' : 'A Vencer';
    }
    return 'Indefinido';
  }

  // Agrupa as linhas de débito pelo nome do imposto, somando o valor de cada um separadamente.
  function agruparPorImposto(rows){
    const grupos = {};
    rows.forEach(r=>{
      if(!grupos[r.nome]) grupos[r.nome] = { nome: r.nome, total: 0, itens: [] };
      grupos[r.nome].total += r.valor;
      grupos[r.nome].itens.push(r);
    });
    return Object.values(grupos).sort((a,b)=> b.total - a.total);
  }

  // Separa as pendências em Vencidas / A Vencer, e dentro de cada grupo, soma por imposto.
  // Dentro de cada linha (Vencido/A Vencer), agrupa as pendências por competência (período de
  // referência do imposto), listando os impostos que caem em cada competência.
  function agruparPorCompetencia(rows){
    const grupos = {};
    rows.forEach(r=>{
      const key = r.periodo || 'Sem competência';
      if(!grupos[key]) grupos[key] = { periodo: key, total: 0, totalMulta: 0, itens: [] };
      grupos[key].total += r.valor;
      grupos[key].totalMulta += Number(r.multa)||0;
      grupos[key].itens.push(r);
    });
    return Object.values(grupos).sort((a,b)=> b.periodo.localeCompare(a.periodo));
  }

  function agruparPorCategoriaEImposto(rows){
    const categorias = { Vencido: [], 'A Vencer': [], Indefinido: [] };
    rows.forEach(r=>{
      (categorias[r.categoria] || categorias.Indefinido).push(r);
    });
    const resultado = {};
    let totalVencido = 0, totalAVencer = 0;
    if(categorias.Vencido.length){ resultado['Vencido'] = agruparPorCompetencia(categorias.Vencido); totalVencido = categorias.Vencido.reduce((s,r)=>s+r.valor,0); }
    if(categorias['A Vencer'].length){ resultado['A Vencer'] = agruparPorCompetencia(categorias['A Vencer']); totalAVencer = categorias['A Vencer'].reduce((s,r)=>s+r.valor,0); }
    if(categorias.Indefinido.length){ resultado['Indefinido'] = agruparPorCompetencia(categorias.Indefinido); }
    return { porCategoria: resultado, totalVencido, totalAVencer };
  }

  // Detecta se o PDF é o "Relatório de Dívida Ativa da União/FGTS" do sistema Regularize (PGFN) —
  // formato de cartões, bem diferente da tabela colunar do relatório "Informações de Apoio" da RFB.
  function isRelatorioPGFN(text){
    return /REGULARIZE|Relat[óo]rio Consolidado da D[íi]vida|inscri[çc][õo]es em d[íi]vida ativa/i.test(text);
  }

  // Extrai as inscrições do Relatório de Dívida Ativa da União (PGFN/Regularize). Layout em
  // cartões — usa âncoras de rótulo (não depende da ordem exata do texto extraído, já que
  // PDFs em duas colunas costumam ter ordem de leitura pouco previsível).
  function parseInscricoesPGFN(text){
    const norm = text.replace(/[ \t]*\n[ \t]*/g, ' ').replace(/\s+/g, ' ');
    const rows = [];
    const inicioCartaoRe = /\d{1,3}\s\d\s\d{2}\s\d{6}-\d{2}\s+\d{2}\/\d{2}\/\d{4}\s+[A-ZÀ-Ú]/g;
    const posicoes = [];
    let mm;
    while((mm = inicioCartaoRe.exec(norm)) !== null){ posicoes.push(mm.index); }
    if(!posicoes.length) return rows;

    for(let i=0; i<posicoes.length; i++){
      const inicio = posicoes[i];
      const fim = i+1 < posicoes.length ? posicoes[i+1] : norm.length;
      const bloco = norm.slice(inicio, fim);

      const inscricaoM = bloco.match(/^(\d{1,3}\s\d\s\d{2}\s\d{6}-\d{2})\s+(\d{2}\/\d{2}\/\d{4})/);
      if(!inscricaoM) continue;
      const numeroInscricao = inscricaoM[1];
      const dataInscricao = inscricaoM[2];

      const situacaoM = bloco.match(/(ATIVA EM COBRAN[ÇC]A|NEGOCIADA|GARANTIDA|SUSPENSA|EXTINTA)\s+R\$\s*([\d.,]+)/i);
      const situacaoTexto = situacaoM ? situacaoM[1].toUpperCase() : '';
      const valorConsolidado = situacaoM ? parseBRNumber(situacaoM[2]) : 0;

      const receitaM = bloco.match(/Receita da d[íi]vida:\s*([\dA-Za-zÀ-ú]{1,6}\s*-\s*[^:]+?)(?=\s*Data da extin|\s*Principal\s*R\$)/i);
      const nome = receitaM ? receitaM[1].trim() : 'Dívida Ativa da União';

      const principalM = bloco.match(/Principal\s*R\$\s*([\d.,]+)/i);
      const multaM = bloco.match(/Multa\s*R\$\s*([\d.,]+)/i);
      const jurosM = bloco.match(/Juros de mora\s*R\$\s*([\d.,]+)/i);
      const encargoM = bloco.match(/Encargo legal\s*R\$\s*([\d.,]+)/i);

      const multa = multaM ? parseBRNumber(multaM[1]) : 0;
      const valor = valorConsolidado || round2((principalM?parseBRNumber(principalM[1]):0) + multa + (jurosM?parseBRNumber(jurosM[1]):0) + (encargoM?parseBRNumber(encargoM[1]):0));

      // O relatório da PGFN não traz um "mês de referência" como o da Receita Federal —
      // usa-se a Data da Inscrição (MM/AAAA) como competência de referência disponível.
      const partesData = dataInscricao.split('/');
      const competencia = partesData.length===3 ? partesData[1]+'/'+partesData[2] : dataInscricao;

      rows.push({
        codigo: numeroInscricao, nome, periodo: competencia, vencimento: dataInscricao,
        valorOriginal: principalM?parseBRNumber(principalM[1]):0, multa, juros: jurosM?parseBRNumber(jurosM[1]):0,
        valor, situacao: situacaoTexto,
        categoria: /ATIVA EM COBRAN/i.test(situacaoTexto) ? 'Vencido' : 'Indefinido',
      });
    }
    return rows;
  }

  // Detecta a "Certidão de Regularidade Fiscal" estadual (Sefaz) — formato de certidão, com
  // débitos tributários (regime + período + valor) e, às vezes, débitos de veículo (IPVA).
  function isCertidaoEstadual(text){
    return /CERTID[ÃA]O DE REGULARIDADE FISCAL/i.test(text) && /Fazenda P[úu]blica Estadual|SEFAZ/i.test(text);
  }

  function parseCertidaoEstadual(text){
    const norm = text.replace(/[ \t]*\n[ \t]*/g, ' ').replace(/\s+/g, ' ');
    const rows = [];

    // Débitos tributários: nome do regime (ex.: SIMPLES NACIONAL) + competência MM/AAAA + valor.
    const debitoRe = /([A-ZÀ-Ú][A-ZÀ-Ú ]{3,30}?)\s+(\d{2}\/\d{4})\s+([\d.,]+)/g;
    let m;
    while((m = debitoRe.exec(norm)) !== null){
      rows.push({
        codigo: '', nome: m[1].trim() + ' (Estadual)', periodo: m[2], vencimento: '',
        valorOriginal: parseBRNumber(m[3]), multa: 0, juros: 0, valor: parseBRNumber(m[3]),
        situacao: 'IRREGULAR', categoria: 'Vencido',
      });
    }

    // Débitos de veículo (IPVA): placa + ano + tipo — geralmente sem valor monetário informado
    // na própria certidão (exige consulta à Sefaz/Detran para o valor exato).
    const ipvaRe = /([A-Z]{3}(?:\d{4}|\d[A-Z]\d{2}))\s+(\d{4})\s+([A-ZÀ-Ú]+)/g;
    while((m = ipvaRe.exec(norm)) !== null){
      rows.push({
        codigo: m[1], nome: m[3] + ' — Placa ' + m[1] + ' (valor a consultar na Sefaz)', periodo: m[2], vencimento: '',
        valorOriginal: 0, multa: 0, juros: 0, valor: 0,
        situacao: 'IRREGULAR', categoria: 'Vencido',
      });
    }

    return rows;
  }

  function parseSituacaoFiscalPdf(text){
    const cnpjMatch = text.match(/(\d{2}\.\d{3}\.\d{3}\/\d{4}-\d{2})/);
    const cnpj = cnpjMatch ? cnpjMatch[1] : '';

    let esfera = '';
    if(/RECEITA FEDERAL|PROCURADORIA-GERAL DA FAZENDA NACIONAL|PGFN/i.test(text)) esfera = 'Federal';
    else if(/SEFAZ|SECRETARIA DA FAZENDA|SECRETARIA DE FAZENDA ESTADUAL/i.test(text)) esfera = 'Estadual';
    else if(/PREFEITURA|SECRETARIA MUNICIPAL/i.test(text)) esfera = 'Municipal';

    const countDevedor = (text.match(/DEVEDOR/gi) || []).length;
    const countSemPendencia = (text.match(/Não foram detectadas pend[êe]ncias/gi) || []).length;
    const countSuspensa = (text.match(/Exigibilidade Suspensa/gi) || []).length;
    const ehPGFN = isRelatorioPGFN(text);
    const ehCertidaoEstadual = isCertidaoEstadual(text);
    const countAtivaEmCobranca = ehPGFN ? (text.match(/ATIVA EM COBRAN[ÇC]A/gi) || []).length : 0;
    const countIrregularidadesEstadual = ehCertidaoEstadual ? (text.match(/IRREGULARIDADE/gi) || []).length : 0;

    if(ehCertidaoEstadual) esfera = 'Estadual';

    let status;
    if(countDevedor > 0 || countAtivaEmCobranca > 0 || countIrregularidadesEstadual > 0) status = 'Irregular';
    else if(countSemPendencia > 0 || ehCertidaoEstadual) status = 'Regular';
    else status = 'Pendente de verificação';

    const situacaoCadastralMatch = text.match(/Situa[çc][ãa]o:\s*([A-ZÀ-Ú]{2,10})/i);
    const emissaoMatch = text.match(/(\d{2}\/\d{2}\/\d{4})\s*\d{2}:\d{2}/);

    const debitoRows = ehPGFN ? parseInscricoesPGFN(text) : ehCertidaoEstadual ? parseCertidaoEstadual(text) : parseDebitoRows(text);
    const gruposImposto = agruparPorImposto(debitoRows);
    const totalGeral = debitoRows.reduce((s,r)=>s+r.valor, 0);
    const totalMultas = debitoRows.reduce((s,r)=>s+(Number(r.multa)||0), 0);
    const { porCategoria, totalVencido, totalAVencer } = agruparPorCategoriaEImposto(debitoRows);

    const partes = [];
    const fonteTexto = ehPGFN ? 'Procuradoria-Geral da Fazenda Nacional (PGFN/Regularize).' : ehCertidaoEstadual ? 'Secretaria da Fazenda Estadual (Sefaz).' : 'Receita Federal.';
    partes.push('Informações extraídas diretamente do relatório oficial da ' + fonteTexto);
    if(ehPGFN){
      partes.push(countAtivaEmCobranca > 0 ? debitoRows.length + ' inscrição(ões) em dívida ativa ativa(s) em cobrança localizada(s) no relatório.' : 'Nenhuma inscrição ativa em cobrança localizada no relatório.');
    } else if(ehCertidaoEstadual){
      partes.push(debitoRows.length > 0 ? debitoRows.length + ' irregularidade(s) localizada(s) na certidão estadual.' : 'Nenhuma irregularidade localizada na certidão estadual.');
    } else {
      partes.push(countDevedor > 0 ? countDevedor + ' pendência(s)/débito(s) localizado(s) no relatório.' : 'Nenhum débito em situação "DEVEDOR" localizado no relatório.');
      if(countSuspensa > 0) partes.push(countSuspensa + ' registro(s) com exigibilidade suspensa (em discussão/parcelado).');
    }
    if(debitoRows.length){
      partes.push('Vencidos: ' + fmtBRL(totalVencido) + '. A vencer: ' + fmtBRL(totalAVencer) + '. Total: ' + fmtBRL(totalGeral) + ' em ' + gruposImposto.length + ' imposto(s)/inscrição(ões) diferente(s).');
    }
    if(totalMultas > 0) partes.push('Total de multas incluídas nesses valores: ' + fmtBRL(totalMultas) + '.');
    if(situacaoCadastralMatch) partes.push('Situação cadastral no relatório: ' + situacaoCadastralMatch[1] + '.');
    partes.push('Importado automaticamente de PDF em ' + todayStr().split('-').reverse().join('/') + '.');
    const resumo = partes.join(' ');

    return {
      ok: !!cnpj,
      cnpj, esfera, status, resumo,
      countDevedor, countSemPendencia, emissao: emissaoMatch ? emissaoMatch[1] : '',
      debitoRows, gruposImposto, totalGeral, totalMultas, porCategoria, totalVencido, totalAVencer,
    };
  }

  // Recebe uma lista de arquivos (File[]) vinda de um <input type="file">; qualquer .zip é
  // "aberto" e seus arquivos internos entram na lista no lugar do .zip — assim quem chama essa
  // função nem precisa saber que um .zip foi usado, só recebe a lista final já expandida.
  // WinRAR também salva/abre .zip normalmente (não precisa ser especificamente o .rar).
  async function expandirArquivosZip(fileList){
    if(!window.JSZip) return Array.from(fileList);
    const resultado = [];
    for(const file of fileList){
      const ehZip = /\.zip$/i.test(file.name) || file.type === 'application/zip' || file.type === 'application/x-zip-compressed';
      if(!ehZip){ resultado.push(file); continue; }
      try{
        const zip = await window.JSZip.loadAsync(file);
        const entradas = Object.values(zip.files).filter(e => !e.dir);
        for(const entrada of entradas){
          const blob = await entrada.async('blob');
          const nomeArquivo = entrada.name.split('/').pop();
          const arquivoExtraido = new File([blob], nomeArquivo, {type: blob.type || ''});
          resultado.push(arquivoExtraido);
        }
      }catch(err){
        console.error('Erro ao abrir ZIP', file.name, err);
      }
    }
    return resultado;
  }

  function baixarArquivoBase64(base64, filename, mimeType){
    mimeType = mimeType || 'application/pdf';
    const byteChars = atob(base64);
    const byteNumbers = new Array(byteChars.length);
    for(let i=0; i<byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
    const byteArray = new Uint8Array(byteNumbers);
    const blob = new Blob([byteArray], {type: mimeType});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function generateRelatorioFiscalPDF(relatorioId){

    if(!r) return;
    if(!window.jspdf || !window.jspdf.jsPDF){ alert('O gerador de PDF ainda está carregando. Tente novamente.'); return; }
    const c = state.clients.find(x=>x.id===r.clientId);

    const doc = new jsPDF({unit:'mm', format:'a4'});

    doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.setTextColor(178,59,59);
    doc.text('Fonte: informações extraídas diretamente do relatório oficial da Receita Federal', 14, y); y += 7;
    doc.setTextColor(20,25,30);
    doc.setFont('helvetica','normal'); doc.setFontSize(10);
    doc.text('Esfera: ' + (r.esfera||'—') + '   Status: ' + (r.status||'—'), 14, y); y += 7;
    doc.text('Arquivo original: ' + (r.nomeArquivoOriginal||'—'), 14, y); y += 7;
    doc.text('Importado em: ' + (r.dataImportacao ? new Date(r.dataImportacao).toLocaleString('pt-BR') : '—'), 14, y); y += 7;
    if(r.totalMultas > 0){
      doc.setFont('helvetica','bold'); doc.setTextColor(178,59,59);
      doc.text('Total de multas nas pendências deste relatório: ' + fmtBRL(r.totalMultas), 14, y); y += 7;
      doc.setTextColor(20,25,30); doc.setFont('helvetica','normal');
    }
    y += 3;
    doc.setFont('helvetica','bold'); doc.text('Resumo automático:', 14, y); y += 6;
    doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
    const resumoLines = doc.splitTextToSize(r.resumo||'—', 180);
    doc.text(resumoLines, 14, y); y += resumoLines.length*4.5 + 8;

    function tabelaCategoria(titulo, competenciaGroups, total, corCabecalho){
      if(!competenciaGroups || !competenciaGroups.length) return;
      doc.setFont('helvetica','bold'); doc.setFontSize(10.5);
      doc.setTextColor(corCabecalho[0], corCabecalho[1], corCabecalho[2]);
      doc.text(titulo + ' — Total ' + fmtBRL(total), 14, y); y += 8;
      doc.setTextColor(20,25,30);
      competenciaGroups.forEach(comp=>{
        if(y > 260){ doc.addPage(); y = 20; }
        doc.setFont('helvetica','bold'); doc.setFontSize(9.5);
        doc.text('Competência ' + comp.periodo + ' — ' + fmtBRL(comp.total) + (comp.totalMulta>0 ? ' (multa: '+fmtBRL(comp.totalMulta)+')' : ''), 14, y); y += 6;
        doc.setFontSize(8.5);
        doc.setFillColor(240,242,245);
        doc.rect(14, y-4, 182, 5.5, 'F');
        doc.setFont('helvetica','bold');
        doc.text('Imposto', 16, y); doc.text('Vencimento', 108, y); doc.text('Multa', 150, y); doc.text('Valor', 196, y, {align:'right'});
        y += 5.5;
        doc.setFont('helvetica','normal');
        comp.itens.forEach(item=>{
          if(y > 270){ doc.addPage(); y = 20; }
          doc.text(item.nome, 16, y);
          doc.text(item.vencimento || '—', 108, y);
          doc.text(item.multa>0 ? fmtBRL(item.multa) : '—', 150, y);
          doc.text(fmtBRL(item.valor), 196, y, {align:'right'});
          y += 5.5;
        });
        y += 4;
      });
      y += 6;
    }

    const pc = r.porCategoria || {};
    tabelaCategoria('Impostos Vencidos', pc['Vencido'], r.totalVencido, [178,59,59]);
    tabelaCategoria('Impostos a Vencer', pc['A Vencer'], r.totalAVencer, [47,122,82]);
    tabelaCategoria('Situação não identificada', pc['Indefinido'], (pc['Indefinido']||[]).reduce((s,c)=>s+c.total,0), [91,107,122]);

    pdfFooterDisclaimer(doc, 'Relatório gerado a partir da leitura automática do PDF oficial baixado da Receita Federal/Sefaz/Prefeitura. A classificação Vencido/A Vencer segue a situação informada no relatório original (DEVEDOR = vencido) ou, quando não identificada, a comparação da data de vencimento com a data de hoje. Confira sempre os valores no portal oficial antes de qualquer pagamento.');
    doc.save('relatorio-situacao-fiscal-importado-' + (c?c.name:'cliente').replace(/[^a-z0-9]+/gi,'-').toLowerCase() + '.pdf');
  }

  function generateSitFiscalPDF(clientId){
    const c = state.clients.find(x=>x.id===clientId);
    if(!c) return;
    if(!window.jspdf || !window.jspdf.jsPDF){
      alert('O gerador de PDF ainda está carregando. Aguarde alguns segundos e tente novamente.');
      return;

  function montarPropostaSnapshot(){
    const clientId = state.propostaClienteId;
    const cliente = state.clients.find(c=>c.id===clientId);
    const fat = parseFloat(state.propostaFaturamento) || 0;
    const { valor: honorarioBase, aCombinar, faixa } = calcHonorarioBase(fat, state.propostaRegime);
    const valorFuncionarios = (Number(state.propostaQtdFuncionarios)||0) * VALOR_POR_EMPREGADO_HONORARIOS;
    const totalExtras = state.propostaItensExtras.reduce((s,i)=>s+(Number(i.valor)||0),0);
    const totalMensal = (honorarioBase||0) + valorFuncionarios + totalExtras;
    return {
      clientId, clienteNome: cliente?cliente.name:'', clienteDoc: cliente?cliente.doc:'',
      regime: state.propostaRegime, faturamento: fat,
      honorarioBase, aCombinar, faixaTexto: faixa ? (fmtBRL(faixa.min)+' até '+(faixa.max===Infinity?'—':fmtBRL(faixa.max))) : '',
      qtdFuncionarios: Number(state.propostaQtdFuncionarios)||0, valorFuncionarios,
      pendencias: state.propostaPendenciasSelecionadas.slice(),
      itensExtras: state.propostaItensExtras.slice(),
      incluirBalanco: state.propostaIncluirBalanco,
      observacoes: state.propostaObservacoes,
      sitFedStatus: cliente?cliente.sitFedStatus:'', sitFedData: cliente?cliente.sitFedData:'', sitFedObs: cliente?cliente.sitFedObs:'',
      sitEstStatus: cliente?cliente.sitEstStatus:'', sitEstData: cliente?cliente.sitEstData:'', sitEstObs: cliente?cliente.sitEstObs:'',
      demonstrativoPendencias: clientId ? demonstrativoPendenciasPorImposto(clientId) : [],
      totalMensal, criadaEm: new Date().toISOString(),
    };
  }

  function generateParcelamentoPDF(parcId){
    const p = state.parcelamentos.find(x=>x.id===parcId);

    if(!window.jspdf || !window.jspdf.jsPDF){ alert('O gerador de PDF ainda está carregando. Tente novamente.'); return; }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({unit:'mm', format:'a4'});
    const c = state.clients.find(x=>x.id===p.clientId);
    let y = pdfHeader(doc, 'Resumo de Parcelamento de Impostos', c ? c.name : '—');
    const pagas = Number(p.parcelasPagas)||0;
    const total = Number(p.quantidadeParcelas)||0;
    const valorParcela = Number(p.valorParcela)||0;
    const saldoDevedor = Math.max(0, valorParcela*(total-pagas));
    doc.setFont('helvetica','normal'); doc.setFontSize(10.5);
    [
      ['Esfera', p.esfera],
      ['Órgão', PARC_ORGAO[p.esfera] || '—'],
      ['Tipo de imposto', p.tipoImposto],
      ['Modalidade', p.modalidade],
      ['Número do processo', p.numeroProcesso],
      ['Data de adesão', p.dataAdesao ? fmtDate(p.dataAdesao) : '—'],
      ['Próximo vencimento', p.proximoVencimento ? fmtDate(p.proximoVencimento) : '—'],
      ['Parcelas', pagas + ' de ' + total + ' pagas'],
      ['Valor de cada parcela', fmtBRL(valorParcela)],
      ['Total do débito original', fmtBRLorDash(p.totalDebito)],
      ['Saldo devedor estimado', fmtBRL(saldoDevedor)],
      ['Status', p.status],
    ].forEach(([label,val])=>{ doc.text(String(label)+': '+String(val||'—'), 14, y); y += 7; });

  function pendenciasClienteParaProposta(clientId){
    const itens = [];

    // Fonte 1: relatórios da Receita Federal importados (PDF), itens já vencidos.
    state.relatoriosFiscais.filter(r=>r.clientId===clientId).forEach(r=>{
      const vencidos = (r.porCategoria && r.porCategoria['Vencido']) || [];
      vencidos.forEach(comp=>{
        comp.itens.forEach(item=>{
          itens.push({
            id: 'pdf::' + r.id + '::' + item.codigo + '::' + item.periodo,
            nome: item.nome, competencia: item.periodo, esfera: r.esfera,
            valorDebito: item.valor, multa: item.multa||0, origem: 'Relatório da Receita Federal',
          });
        });
      });
    });

    // Fonte 2: Guias/obrigações do tipo Imposto cadastradas manualmente (Calendário/Centro de Controle), ainda não concluídas.
    state.obrigacoes.filter(o=>o.clientId===clientId && o.tipo==='Imposto' && !o.concluded).forEach(o=>{
      itens.push({
        id: 'obg::' + o.id,
        nome: o.categoria || o.titulo || 'Imposto', competencia: o.vencimento ? o.vencimento.slice(0,7).split('-').reverse().join('/') : '—',
        esfera: '', valorDebito: Number(o.valor)||0, multa: 0, origem: 'Guia cadastrada no sistema',
      });
    });

    // Fonte 3: Parcelamentos de impostos ativos (não quitados/rescindidos).
    state.parcelamentos.filter(p=>p.clientId===clientId && p.status!=='Quitado' && p.status!=='Rescindido').forEach(p=>{
      const pagas = Number(p.parcelasPagas)||0, total = Number(p.quantidadeParcelas)||0, valorParcela = Number(p.valorParcela)||0;
      itens.push({
        id: 'parc::' + p.id,
        nome: (p.tipoImposto||'Parcelamento') + ' (' + pagas + '/' + total + ' parcelas)', competencia: p.proximoVencimento ? fmtDate(p.proximoVencimento) : '—',
        esfera: p.esfera||'', valorDebito: Math.max(0, valorParcela*(total-pagas)), multa: 0, origem: 'Parcelamento (' + (p.status||'Em dia') + ')',
      });
    });

    return itens;
  }

  // Agrupa as pendências pelo nome do imposto/declaração, somando o valor total e listando
  // todas as competências em que ele aparece — usado como demonstrativo na proposta.
  function demonstrativoPendenciasPorImposto(clientId){
    const itens = pendenciasClienteParaProposta(clientId);
    const grupos = {};
    itens.forEach(it=>{
      if(!grupos[it.nome]) grupos[it.nome] = { nome: it.nome, total: 0, competencias: [] };
      grupos[it.nome].total += Number(it.valorDebito)||0;
      if(it.competencia && !grupos[it.nome].competencias.includes(it.competencia)) grupos[it.nome].competencias.push(it.competencia);
    });
    return Object.values(grupos).sort((a,b)=> b.total - a.total);
  }

  function generateGuiaPDF(tipo){
    if(!window.jspdf || !window.jspdf.jsPDF){ alert('O gerador de PDF ainda está carregando. Tente novamente.'); return; }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({unit:'mm', format:'a4'});
    const list = state.folhas.filter(f=>f.competencia===state.competenciaAtiva);
    let y = pdfHeader(doc, 'Resumo de Guia — ' + tipo, 'Competência ' + monthLabel(state.competenciaAtiva) + '/' + state.competenciaAtiva.slice(0,4));
    doc.setFont('helvetica','normal'); doc.setFontSize(10);
    const total = list.reduce((s,f)=> s + (tipo==='FGTS' ? (f.fgts||0) : (f.inss||0)), 0);
    doc.text('Total ' + (tipo==='FGTS' ? 'a depositar de FGTS' : 'retido de INSS') + ': ' + fmtBRL(total), 14, y);
    y += 10;
    list.forEach(f=>{
      const valor = tipo==='FGTS' ? f.fgts : f.inss;
      const linha = clientNameOrFunc(f.funcionarioId) + ' — ' + fmtBRL(valor);
      doc.text(linha, 14, y);
      y += 6;
      if(y > 250){ doc.addPage(); y = 20; }
    });
    pdfFooterDisclaimer(doc, 'Este resumo é um controle interno gerado a partir das folhas calculadas no sistema. Não é a guia oficial com código de barras — emita a guia definitiva no FGTS Digital (Caixa/eSocial) ou no sistema de arrecadação do INSS/DARF.');
    doc.save('guia-' + tipo.toLowerCase() + '-' + state.competenciaAtiva + '.pdf');
  }

  function generateRelatorioFolhaPDF(){
    if(!window.jspdf || !window.jspdf.jsPDF){ alert('O gerador de PDF ainda está carregando. Tente novamente.'); return; }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({unit:'mm', format:'a4'});
    const list = state.folhas.filter(f=>f.competencia===state.competenciaAtiva);
    let y = pdfHeader(doc, 'Relatório de Folha de Pagamento', 'Competência ' + monthLabel(state.competenciaAtiva) + '/' + state.competenciaAtiva.slice(0,4));
    doc.setFont('helvetica','normal'); doc.setFontSize(9);
    if(!list.length){
      doc.text('Nenhuma folha calculada nesta competência.', 14, y);

      list.forEach(f=>{
        doc.setFont('helvetica','bold'); doc.text(clientNameOrFunc(f.funcionarioId), 14, y); y+=5;
        doc.setFont('helvetica','normal');
        doc.text('Bruto: ' + fmtBRL(f.bruto) + '   INSS: ' + fmtBRL(f.inss) + '   IRRF: ' + fmtBRL(f.irrf) + '   Líquido: ' + fmtBRL(f.liquido), 14, y);

        if(y > 250){ doc.addPage(); y = 20; }

  function generateRelatorioResumoPDF(){
    if(!window.jspdf || !window.jspdf.jsPDF){ alert('O gerador de PDF ainda está carregando. Tente novamente.'); return; }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({unit:'mm', format:'a4'});
    let y = pdfHeader(doc, 'Relatório Resumo — Departamento Pessoal', monthLabel(state.competenciaAtiva) + '/' + state.competenciaAtiva.slice(0,4));
    const folhasComp = state.folhas.filter(f=>f.competencia===state.competenciaAtiva);
    const totBruto = folhasComp.reduce((s,f)=>s+(f.bruto||0),0);
    const totLiquido = folhasComp.reduce((s,f)=>s+(f.liquido||0),0);
    const totFgts = folhasComp.reduce((s,f)=>s+(f.fgts||0),0);
    doc.setFont('helvetica','normal'); doc.setFontSize(10);
    [
      ['Funcionários cadastrados', state.funcionarios.length],
      ['Folhas calculadas nesta competência', folhasComp.length],
      ['Total bruto da folha', fmtBRL(totBruto)],
      ['Total líquido da folha', fmtBRL(totLiquido)],
      ['Total FGTS a depositar', fmtBRL(totFgts)],
      ['Férias registradas (histórico)', state.ferias.length],
      ['Rescisões registradas (histórico)', state.rescisoes.length],
    ].forEach(([label,val])=>{ doc.text(label + ': ' + val, 14, y); y += 7; });
    pdfFooterDisclaimer(doc, 'Resumo consolidado gerado automaticamente pelo sistema a partir dos registros de folha, férias e rescisão. Uso interno do escritório.');
    doc.save('relatorio-resumo-dp-' + state.competenciaAtiva + '.pdf');
  }

  function buscarFaixaHonorario(faturamento){
    return TABELA_HONORARIOS.find(f => faturamento >= f.min && faturamento <= f.max) || null;

  function calcHonorarioBase(faturamento, regime){
    const faixa = buscarFaixaHonorario(faturamento);
    if(!faixa) return { valor: null, aCombinar: true, faixa: null };
    const valor = regime === 'Lucro Presumido' ? faixa.presumido : faixa.simples;
    return { valor, aCombinar: valor===null, faixa };
  }

  function findClientByDoc(docNumber){
    const digits = onlyDigits(docNumber);
    if(!digits) return null;
    return state.clients.find(c => onlyDigits(c.doc||'') === digits) || null;
  }

  // Tenta casar o cliente pelo emitente (a nota foi emitida por ele = Saída) ou pelo
  // destinatário (a nota foi emitida para ele = Entrada); serviços já vêm com sugestão própria.
  function matchClientAndOperacao(result){
    if(result.tipoOperacaoSugerida === 'Serviços'){
      const found = findClientByDoc(result.emitDoc);
      if(found) return { client: found, tipoOperacao: 'Serviços', matchedDoc: result.emitDoc, matchedNome: result.emitNome };
    }
    const foundEmit = findClientByDoc(result.emitDoc);
    if(foundEmit) return { client: foundEmit, tipoOperacao: 'Saída', matchedDoc: result.emitDoc, matchedNome: result.emitNome };
    const foundDest = findClientByDoc(result.destDoc);
    if(foundDest) return { client: foundDest, tipoOperacao: 'Entrada', matchedDoc: result.destDoc, matchedNome: result.destNome };
    return { client: null, tipoOperacao: result.tipoOperacaoSugerida || '', matchedDoc: result.emitDoc || result.destDoc, matchedNome: result.emitNome || result.destNome };
  }

  // colunas CÓDIGO, DESCRIÇÃO, TIPO (S/A), CONTA SUPERIOR, NÍVEL, NATUREZA (1-4).
  function parsePlanoContasExcel(arrayBuffer){
    if(!window.XLSX) return { ok:false, error:'A biblioteca de leitura de Excel ainda está carregando. Tente novamente em instantes.' };
    let wb;
    try{ wb = window.XLSX.read(arrayBuffer, {type:'array'}); }
    catch(e){ return { ok:false, error:'Não foi possível ler o arquivo. Confirme que é um .xlsx válido.' }; }

  }

  function naturezaLabel(naturezaRfb, descricao){
    const n = Number(naturezaRfb);
    if(n===1) return 'Devedora';
    if(n===2 || n===3) return 'Credora';
    // Natureza 4 (contas de resultado) não distingue receita/despesa pelo código —
    // usa a própria descrição como pista (convenção do RFB: despesas/custos vêm com "(-)").
    const desc = String(descricao||'').toUpperCase();
    if(desc.startsWith('(-)') || desc.includes('CUSTO') || desc.includes('DESPESA')) return 'Devedora';
    return 'Credora';
  }

  function extractPlanoContasFromSheet(workbook, sheetName){
    const ws = workbook.Sheets[sheetName];
    if(!ws) return { ok:false, error:'Aba não encontrada no arquivo.' };
    const rows = window.XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null});
    if(!rows.length) return { ok:false, error:'A aba selecionada está vazia.' };

    // Localiza a linha de cabeçalho (contém "CÓDIGO" e "DESCRIÇÃO").
    let headerIdx = -1, cols = {};
    for(let i=0;i<Math.min(rows.length,10);i++){
      const row = rows[i].map(c=>String(c||'').trim().toUpperCase());
      const iCodigo = row.findIndex(c=>c.includes('CÓDIGO')||c.includes('CODIGO'));
      const iDesc = row.findIndex(c=>c.includes('DESCRIÇÃO')||c.includes('DESCRICAO'));
      if(iCodigo>=0 && iDesc>=0){
        headerIdx = i;
        cols = {
          codigo: iCodigo, descricao: iDesc,
          tipo: row.findIndex(c=>c==='TIPO'),
          contaSuperior: row.findIndex(c=>c.includes('CONTA SUPERIOR')),
          nivel: row.findIndex(c=>c.includes('NÍVEL')||c.includes('NIVEL')),
          natureza: row.findIndex(c=>c.includes('NATUREZA')),
        };
        break;
      }
    }
    if(headerIdx===-1) return { ok:false, error:'Não foi possível localizar as colunas CÓDIGO e DESCRIÇÃO nesta aba. Confirme se é uma aba do Plano de Contas Referencial.' };

    const contas = [];
    for(let i=headerIdx+1; i<rows.length; i++){
      const row = rows[i];
      if(!row || row[cols.codigo]===null || row[cols.codigo]===undefined || row[cols.codigo]==='') continue;
      const codigo = String(row[cols.codigo]).trim();
      const descricao = cols.descricao>=0 ? String(row[cols.descricao]||'').trim() : '';
      if(!descricao) continue;
      const tipoRaw = cols.tipo>=0 ? String(row[cols.tipo]||'').trim().toUpperCase() : '';
      const naturezaRfb = cols.natureza>=0 ? row[cols.natureza] : null;
      contas.push({
        codigo, descricao,
        tipo: tipoRaw==='S' ? 'Sintética' : (tipoRaw==='A' ? 'Analítica' : ''),
        contaSuperior: cols.contaSuperior>=0 ? String(row[cols.contaSuperior]||'').trim() : '',
        nivel: cols.nivel>=0 ? Number(row[cols.nivel])||0 : 0,
        naturezaRfb: naturezaRfb!==null && naturezaRfb!==undefined ? Number(naturezaRfb) : null,
        natureza: naturezaLabel(naturezaRfb, descricao),
      });
    }
    return { ok: contas.length>0, error: contas.length ? '' : 'Nenhuma conta encontrada nesta aba.', contas };
  }

  // Reads a NF-e/NFC-e XML (national standard, modelo 55/65) or a best-effort NFS-e XML
  // (layout varies by município — there is no single national standard for service invoices)
  // and extracts the fields our Notas Fiscais registry uses.
  // Lê um arquivo OFX de extrato bancário (aceita tanto o formato SGML clássico — OFX 1.x,
  // usado pela maioria dos bancos brasileiros — quanto o XML — OFX 2.x).
  function parseOfx(text){
    const transacoes = [];
    const stmtRe = /<STMTTRN>([\s\S]*?)<\/STMTTRN>/gi;
    let m;
    while((m = stmtRe.exec(text)) !== null){
      const block = m[1];
      function getTag(tag){
        const re = new RegExp('<' + tag + '>([^<\\r\\n]*)', 'i');
        const mm = block.match(re);
        return mm ? mm[1].trim() : '';
      }
      const trntype = getTag('TRNTYPE');
      const dtposted = getTag('DTPOSTED');
      const trnamt = getTag('TRNAMT');
      const fitid = getTag('FITID');
      const memo = getTag('MEMO') || getTag('NAME');
      const dateMatch = dtposted.match(/(\d{4})(\d{2})(\d{2})/);
      const data = dateMatch ? dateMatch[1] + '-' + dateMatch[2] + '-' + dateMatch[3] : '';
      const valor = parseFloat(trnamt.replace(',', '.')) || 0;
      if(data) transacoes.push({ tipo: trntype, data, valor, fitid, memo: memo || 'Lançamento bancário (OFX)' });
    }
    const bankIdMatch = text.match(/<BANKID>([^<\r\n]*)/i);
    const acctIdMatch = text.match(/<ACCTID>([^<\r\n]*)/i);
    return {
      ok: transacoes.length > 0,
      transacoes,
      banco: bankIdMatch ? bankIdMatch[1].trim() : '',
      conta: acctIdMatch ? acctIdMatch[1].trim() : '',
    };
  }

  function parseNotaFiscalXml(xmlText){
    let doc;
    try{
      doc = new DOMParser().parseFromString(xmlText, 'application/xml');
    }catch(e){
      return { ok:false, error:'Não foi possível ler o arquivo. Verifique se é um XML válido.' };
    }
    if(doc.getElementsByTagName('parsererror').length){
      return { ok:false, error:'Arquivo XML inválido ou corrompido.' };
    }

    // --- NF-e / NFC-e (padrão nacional, modelo 55 ou 65) ---
    const infNFe = doc.getElementsByTagName('infNFe')[0];
    if(infNFe){
      const ideEl = infNFe.getElementsByTagName('ide')[0];
      const mod = getTagText(ideEl, 'mod');
      const nNF = getTagText(ideEl, 'nNF');
      const serie = getTagText(ideEl, 'serie');
      const dhEmi = getTagText(ideEl, 'dhEmi') || getTagText(ideEl, 'dEmi');
      const emitEl = infNFe.getElementsByTagName('emit')[0];
      const emitCNPJ = getTagText(emitEl, 'CNPJ') || getTagText(emitEl, 'CPF');
      const emitNome = getTagText(emitEl, 'xNome');
      const destEl = infNFe.getElementsByTagName('dest')[0];
      const destCNPJ = getTagText(destEl, 'CNPJ') || getTagText(destEl, 'CPF');
      const destNome = getTagText(destEl, 'xNome');
      const totalEl = infNFe.getElementsByTagName('total')[0];
      const icmsTotEl = totalEl ? totalEl.getElementsByTagName('ICMSTot')[0] : null;
      const vNF = getTagText(icmsTotEl, 'vNF');
      const infProt = doc.getElementsByTagName('infProt')[0];
      const cStat = getTagText(infProt, 'cStat');
      const status = (cStat === '101' || cStat === '151' || cStat === '135') ? 'Cancelada' : 'Emitida';
      return {
        ok:true,
        tipo: mod === '65' ? 'NFC-e (Consumidor)' : 'NF-e (Produto)',
        numero: nNF, serie, dataEmissao: dhEmi ? dhEmi.slice(0,10) : '',
        valor: vNF, status,
        emitDoc: emitCNPJ, emitNome, destDoc: destCNPJ, destNome,
      };
    }

    // --- NFS-e Padrão Nacional (Lei Complementar 175/2020 — tag <infNFSe>, adotado por número
    // crescente de prefeituras desde 2025) ---
    const infNFSe = doc.getElementsByTagName('infNFSe')[0];
    if(infNFSe){
      const nNFSe = getTagText(infNFSe, 'nNFSe');
      const cStat = getTagText(infNFSe, 'cStat');
      const emitEl = infNFSe.getElementsByTagName('emit')[0];
      const emitCNPJ = getTagText(emitEl, 'CNPJ') || getTagText(emitEl, 'CPF');
      const emitNome = getTagText(emitEl, 'xNome');
      const valoresEl = infNFSe.getElementsByTagName('valores')[0];
      const vLiq = getTagText(valoresEl, 'vLiq');
      const infDPS = infNFSe.getElementsByTagName('infDPS')[0];
      const dhEmi = getTagText(infDPS, 'dhEmi') || getTagText(infDPS, 'dCompet');
      const serie = getTagText(infDPS, 'serie');
      const tomaEl = infDPS ? infDPS.getElementsByTagName('toma')[0] : null;
      const tomaCNPJ = getTagText(tomaEl, 'CNPJ') || getTagText(tomaEl, 'CPF');
      const tomaNome = getTagText(tomaEl, 'xNome');
      // cStat 100 = autorizada/emitida. Demais códigos indicam cancelamento/rejeição na maioria
      // dos leiautes NFS-e nacionais — trate qualquer código diferente de 100 como Cancelada.
      const status = cStat === '100' ? 'Emitida' : 'Cancelada';
      return {
        ok:true,
        tipo: 'NFS-e (Serviço)',
        numero: nNFSe, serie: serie || '', dataEmissao: dhEmi ? dhEmi.slice(0,10) : '',
        valor: vLiq, status,
        emitDoc: emitCNPJ, emitNome, destDoc: tomaCNPJ, destNome: tomaNome,
        tipoOperacaoSugerida: 'Serviços',
      };
    }

    // --- NFS-e (sem padrão nacional único — tentativa com layout ABRASF, o mais comum) ---
    const looksLikeNfse = doc.getElementsByTagName('InfNfse').length || doc.getElementsByTagName('Nfse').length || doc.getElementsByTagName('CompNfse').length;
    if(looksLikeNfse){
      const infNfse = doc.getElementsByTagName('InfNfse')[0] || doc;
      const numero = getTagText(infNfse, 'Numero') || getTagText(infNfse, 'numero');
      const dataEmissao = getTagText(infNfse, 'DataEmissao') || getTagText(infNfse, 'DataEmissaoRps');
      const valor = getTagText(infNfse, 'ValorLiquidoNfse') || getTagText(infNfse, 'ValorServicos');
      const prestador = doc.getElementsByTagName('PrestadorServico')[0] || doc.getElementsByTagName('IdentificacaoPrestador')[0];
      const prestCNPJ = getTagText(prestador, 'Cnpj') || getTagText(prestador, 'CNPJ') || getTagText(prestador, 'CpfCnpj');
      const tomador = doc.getElementsByTagName('TomadorServico')[0] || doc.getElementsByTagName('IdentificacaoTomador')[0];
      const tomadorCNPJ = getTagText(tomador, 'Cnpj') || getTagText(tomador, 'CNPJ') || getTagText(tomador, 'CpfCnpj');
      const cancelado = doc.getElementsByTagName('NfseCancelamento').length > 0;
      return {
        ok:true,
        tipo: 'NFS-e (Serviço)',
        numero, serie: '', dataEmissao: dataEmissao ? dataEmissao.slice(0,10) : '',
        valor, status: cancelado ? 'Cancelada' : 'Emitida',
        emitDoc: prestCNPJ, emitNome: '', destDoc: tomadorCNPJ, destNome: '',
        tipoOperacaoSugerida: 'Serviços',
        partial: !numero || !valor,
      };
    }

    return { ok:false, error:'Formato de XML não reconhecido. Confirme que é um XML de NF-e, NFC-e ou NFS-e, ou preencha os dados manualmente.' };
  }
